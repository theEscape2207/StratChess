name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref. Minutes are free on a public
# repository, but the 20-job concurrency ceiling is shared across the whole
# account, so a superseded run still costs the next one its start slot. Pushes to
# main are exempt: every merge deserves its own completed verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decide how much validation this diff is worth, using the SAME classifier the
  # local pre-PR script uses (StratChessEvolved/Scripts/Get-ChangeTier.ps1) -- one
  # definition, so CI and the local convention cannot drift apart. See issue #124
  # and .claude/plans/validation-change-tiers.md.
  #
  # Needs fetch-depth: 0 because the default shallow single-commit checkout makes
  # the base-ref diff impossible. This is why classification is its own small job:
  # build-and-test keeps its cheap shallow checkout.
  classify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      is_full: ${{ steps.tier.outputs.is_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: tier
        env:
          # A pull request compares against origin/main. A push cannot: on a push
          # to main, origin/main IS HEAD, so that diff is empty -- and an empty
          # diff correctly returns the weakest tier, which made every merge
          # classify as Docs no matter what it contained (issue #185).
          #
          # github.event.before is the tip main held before the push. For this
          # repo's shape -- one merge commit per push -- that is the previous main
          # tip, and unlike HEAD^ it stays correct if a push ever carries several
          # commits.
          #
          # If the ref is unreachable (force push, or the all-zeros SHA on branch
          # creation) the diff fails and Get-ChangeTier.ps1 returns Engine tier.
          # That fail-closed path is deliberate: do not add a fallback that
          # guesses something cheaper.
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          $c = & .\StratChessEvolved\Scripts\Get-ChangeTier.ps1 -BaseRef $env:BASE_REF
          Write-Host "Change tier: $($c.Tier) (decided by: $($c.DecidingFile))"
          Write-Host "Changed files:"
          $c.ChangedFiles | ForEach-Object { Write-Host "  $_" }
          "tier=$($c.Tier)" | Out-File $env:GITHUB_OUTPUT -Append
          "is_full=$($c.IsFull.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

  build-linux:
    needs: classify
    # Tier-gated on both events now that classify can read a push (#185). A Docs
    # or Tooling merge to main runs nothing, because by definition nothing it
    # contains can affect the build.
    if: needs.classify.outputs.is_full == 'true'
    # Pinned to the exact image (not the moving ubuntu-latest label) — the code
    # needs GCC >= 13 for std::format, matching the Windows job's pinning approach.
    runs-on: ubuntu-24.04
    # Release and Debug are not redundant -- the same asymmetry documented for the
    # Windows job in issue #146 is compiler-independent. Debug keeps assert() and
    # the #ifndef NDEBUG bitboard/mailbox tripwire in Eval.cpp live; Release is the
    # only leg that runs the optimizer. Two Linux legs at 1x still bill less than
    # one Windows leg at 2x.
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Keyed on the pinned dependency tags, matching the Windows job's approach.
      # Not matrix-scoped: FetchContent sources have no per-configuration content,
      # so both legs want the identical cache.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      # Same '~[slow]' filter as the Windows job, deliberately: the legs must
      # cover the same cases. The fast tier is self-contained -- no Catch2 test
      # reads Tests/*.json -- so the working directory does not matter here.
      - name: Run fast tests
        run: ./build/StratChessTests '~[slow]'

  # ASan + UBSan over the fast tier. See issue #179.
  #
  # Why it earns a job of its own rather than a third leg of the matrix above:
  # it is the only one that can catch a *silent* fault. The engine indexes raw
  # fixed-size arrays with computed values everywhere -- the 64 x 4096 magic
  # tables, the PSTs, ThreadData's killer/history tables, Board's mailbox -- and
  # an out-of-bounds read there does not crash. It returns a wrong evaluation,
  # which then gets credited to whatever change is under test.
  #
  # Debug, not Release: assert() and the #ifndef NDEBUG tripwires stay live and
  # catch a different class of fault than the sanitizers do, so one Debug leg is
  # worth more than one Release leg. Linux-only -- the GNU -fsanitize= spelling
  # does not survive the MSVC driver, and CMakeLists.txt refuses it there rather
  # than producing an uninstrumented binary that looks instrumented.
  #
  # Cost: one extra 1x job, seconds of test execution even at ASan's slowdown.
  sanitize-linux:
    needs: classify
    # Same condition as build-linux, deliberately shared rather than narrowed to
    # the Engine tier: a Build-tier change to CMakeLists.txt is exactly what can
    # break the sanitizer wiring, and two conditions would eventually drift.
    if: needs.classify.outputs.is_full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Same key as build-linux: FetchContent sources are identical whatever the
      # build type or instrumentation, so this shares that job's cache entry.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      # STRAT_SANITIZE_RECOVER is left at its OFF default on purpose: sanitizers
      # report and continue otherwise, which exits 0 and would turn this job green
      # with the findings sitting in the log.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSTRAT_SANITIZE=address,undefined

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      # Same '~[slow]' filter as every other leg. The fast tier already runs perft
      # to depth 4 from the start position and depth 3 from Kiwipete, which is the
      # densest exercise of move generation in the suite.
      - name: Run fast tests
        run: ./build/StratChessTests '~[slow]'

  build-and-test:
    needs: classify
    # The only job that builds what actually ships: the clang-cl branch of
    # strat_configure_target, the eight _MSC_VER/_WIN32 sites across Compat.h,
    # PieceHelper.h, SquareHelper.h and StdAfx.h, the MSVC standard library, and
    # lld-link/ThinLTO. Two of the three clang-cl flag spellings fail SILENTLY
    # when wrong (#84), so no Linux leg can stand in for it.
    #
    # This ran on demand only, behind a 'windows-ci' label, for exactly one
    # reason: Windows bills at 2x and was ~75% of Actions spend while the
    # repository was private. It went public on 2026-08-04 and standard runners
    # are free there, so the gate is gone and this shares build-linux's trigger.
    #
    # Do not reinstate the label without reinstating its cost argument -- and do
    # not reinstate the reasoning that accompanied it. The claim that
    # Validate-PrePR.ps1 is "a strict superset" of this job held only for the
    # Release leg: the script never passes -Config, so it takes build.ps1's
    # Release default and never compiles Debug at all.
    if: needs.classify.outputs.is_full == 'true'
    # Pinned to the explicit VS2026 image (not the moving windows-latest label) —
    # keeps the toolchain fixed until it is changed deliberately.
    # See .claude/plans/full-build-test-ci-github-actions.md.
    runs-on: windows-2025-vs2026
    # Release and Debug are NOT redundant -- each catches a class of failure the
    # other structurally cannot, so both are required (see issue #146):
    #
    #   Debug   -- assert() is live, so DoMove's move/side-to-move invariants and
    #              the #ifndef NDEBUG tripwires (e.g. Eval.cpp's bitboard/mailbox
    #              consistency check in BuildContext) actually execute. Release
    #              compiles all of them out and silently tolerates the OOB reads
    #              they exist to catch.
    #   Release -- NDEBUG elides assert(), which turns any variable used *only*
    #              inside one into an unreferenced local: C4189 under this
    #              project's Level4 + /WX, i.e. a build error that exists in
    #              Release only. (This is why CLAUDE.md lists [[maybe_unused]] as
    #              an approved suppression.) It is also the only leg where the
    #              optimizer runs, and the only one that builds what ships.
    #
    # The legs run on separate runners in parallel, so this costs runner minutes
    # but effectively no wall-clock on PR feedback. Debug test *execution* is
    # ~3x slower than Release but that is ~4s vs ~1s on the fast tier -- the cost
    # here is the second build, not the second test run.
    strategy:
      # Both legs must report independently: a Debug-only assertion failure must
      # not cancel the Release leg (or vice versa) and leave the actual /WX or
      # optimizer status unknown.
      fail-fast: false
      matrix:
        config: [Release, Debug]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      # Every Windows preset points FETCHCONTENT_BASE_DIR at build/_deps, so the
      # Release and Debug legs share one dependency clone and one cache entry.
      #
      # The key is intentionally NOT matrix-scoped: the FetchContent sources are
      # identical across configurations. On a cold cache both legs race to save it
      # and the loser logs "Unable to reserve cache ... another job may be creating
      # this cache" — a warning, not a failure, and the next run hits the cache
      # either way. Do not "fix" it by adding ${{ matrix.config }} to the key:
      # that would store two identical copies.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: win-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      # "all", not tests-only. INTERPROCEDURAL_OPTIMIZATION_RELEASE is set on the
      # StratChessEvolved target alone, so a tests-only build never performs the
      # ThinLTO link that ships -- which made "the only job that builds what
      # ships" aspirational rather than true. That link is worth its minutes now
      # that they are free.
      #
      # build.ps1 imports the VS developer environment itself, so no separate
      # setup step is needed here. It defaults to clang-cl, which is what ships;
      # if a runner image ever lacks the VS Clang component, `-Compiler msvc` is
      # the one-word fallback and build.ps1 says so by name.
      - name: Build
        run: .\build.ps1 all -Config ${{ matrix.config }}

      # Same '~[slow]' filter in both configs, deliberately: the two legs must
      # cover the same cases, since the point is that they disagree about which
      # of those cases fail, not about which run.
      - name: Run fast tests
        run: |
          $exe = .\StratChessEvolved\Scripts\Get-BuildArtifact.ps1 -Target StratChessTests -Config ${{ matrix.config }}
          & $exe '~[slow]'
          exit $LASTEXITCODE

  # The single always-present check, and the name must not change.
  #
  # This is the required status check. Required checks are free on a public
  # repository, so as of 2026-08-04 a red run BLOCKS the merge -- it is no longer
  # advisory. The single-check shape is what made that a settings change rather
  # than a rewrite; keep it.
  #
  # Every leg now runs for Build- and Engine-tier changes, on pull requests and
  # merges alike. Docs and Tooling changes skip all of them, which is a pass, not
  # a gap: SKIPPED is reported as success on purpose, because a required check
  # that never runs would block those PRs forever.
  build-and-test-result:
    needs: [classify, build-linux, sanitize-linux, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          echo "tier=${{ needs.classify.outputs.tier }}"
          echo "linux result=${{ needs.build-linux.result }}"
          echo "sanitizer result=${{ needs.sanitize-linux.result }}"
          echo "windows result=${{ needs.build-and-test.result }}"

          case "${{ needs.classify.result }}" in
            success) ;;
            *) echo "Classification did not succeed; cannot certify this run."; exit 1 ;;
          esac

          case "${{ needs.build-linux.result }}" in
            success) echo "Linux build and tests passed." ;;
            skipped) echo "Linux skipped: '${{ needs.classify.outputs.tier }}' tier cannot affect the build." ;;
            *)       echo "Linux build and tests did not pass."; exit 1 ;;
          esac

          case "${{ needs.sanitize-linux.result }}" in
            success) echo "ASan/UBSan build and tests passed." ;;
            skipped) echo "Sanitizers skipped: '${{ needs.classify.outputs.tier }}' tier cannot affect the build." ;;
            *)       echo "ASan/UBSan reported a finding, or the instrumented build failed."; exit 1 ;;
          esac

          case "${{ needs.build-and-test.result }}" in
            success) echo "Windows build and tests passed." ;;
            skipped) echo "Windows skipped: '${{ needs.classify.outputs.tier }}' tier cannot affect the build." ;;
            *)       echo "Windows build and tests did not pass."; exit 1 ;;
          esac

          exit 0
