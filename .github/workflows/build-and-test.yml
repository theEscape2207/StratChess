name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  # Windows is demoted to nightly. It bills at 2x per minute against included
  # minutes where Linux bills at 1x (see issue #81). Runs nightly, or on demand
  # via the 'windows-ci' label.
  schedule:
    - cron: '0 3 * * *'

jobs:
  # Decide how much validation this diff is worth, using the SAME classifier the
  # local pre-PR script uses (StratChessEvolved/Scripts/Get-ChangeTier.ps1) -- one
  # definition, so CI and the local convention cannot drift apart. See issue #124
  # and .claude/plans/validation-change-tiers.md.
  #
  # Needs fetch-depth: 0 because the default shallow single-commit checkout makes
  # 'git diff origin/main...HEAD' impossible. This is why classification is its own
  # small job: build-and-test keeps its cheap shallow checkout.
  classify:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      is_full: ${{ steps.tier.outputs.is_full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: tier
        run: |
          $c = & .\StratChessEvolved\Scripts\Get-ChangeTier.ps1 -BaseRef origin/main
          Write-Host "Change tier: $($c.Tier) (decided by: $($c.DecidingFile))"
          Write-Host "Changed files:"
          $c.ChangedFiles | ForEach-Object { Write-Host "  $_" }
          "tier=$($c.Tier)" | Out-File $env:GITHUB_OUTPUT -Append
          "is_full=$($c.IsFull.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

  build-linux:
    needs: classify
    if: github.event_name == 'push' || github.event_name == 'schedule' || needs.classify.outputs.is_full == 'true'
    # Pinned to the exact image (not the moving ubuntu-latest label) — the code
    # needs GCC >= 13 for std::format, matching the Windows job's pinning approach.
    runs-on: ubuntu-24.04
    # Release and Debug are not redundant -- the same asymmetry documented for the
    # Windows job in issue #146 is compiler-independent. Debug keeps assert() and
    # the #ifndef NDEBUG bitboard/mailbox tripwire in Eval.cpp live; Release is the
    # only leg that runs the optimizer. Two Linux legs at 1x still bill less than
    # one Windows leg at 2x.
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Keyed on the pinned dependency tags, matching the Windows job's approach.
      # Not matrix-scoped: FetchContent sources have no per-configuration content,
      # so both legs want the identical cache.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      # Same '~[slow]' filter as the Windows job, deliberately: the legs must
      # cover the same cases. The fast tier is self-contained -- no Catch2 test
      # reads Tests/*.json -- so the working directory does not matter here.
      - name: Run fast tests
        run: ./build/StratChessTests '~[slow]'

  build-and-test:
    needs: classify
    # Nightly, or on demand via the 'windows-ci' label. Pushes to main still run
    # so the actions/cache deps cache on the default branch does not lapse.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'windows-ci')
    # Pinned to the explicit VS2026 image (not the moving windows-latest label) —
    # this project's projects pin PlatformToolset v145, which matches this image's
    # default VC.Tools.x86.x64 toolset. See .claude/plans/full-build-test-ci-github-actions.md.
    runs-on: windows-2025-vs2026
    # Release and Debug are NOT redundant -- each catches a class of failure the
    # other structurally cannot, so both are required (see issue #146):
    #
    #   Debug   -- assert() is live, so DoMove's move/side-to-move invariants and
    #              the #ifndef NDEBUG tripwires (e.g. Eval.cpp's bitboard/mailbox
    #              consistency check in BuildContext) actually execute. Release
    #              compiles all of them out and silently tolerates the OOB reads
    #              they exist to catch.
    #   Release -- NDEBUG elides assert(), which turns any variable used *only*
    #              inside one into an unreferenced local: C4189 under this
    #              project's Level4 + /WX, i.e. a build error that exists in
    #              Release only. (This is why CLAUDE.md lists [[maybe_unused]] as
    #              an approved suppression.) It is also the only leg where the
    #              optimizer runs, and the only one that builds what ships.
    #
    # The legs run on separate runners in parallel, so this costs runner minutes
    # but effectively no wall-clock on PR feedback. Debug test *execution* is
    # ~3x slower than Release but that is ~4s vs ~1s on the fast tier -- the cost
    # here is the second build, not the second test run.
    strategy:
      # Both legs must report independently: a Debug-only assertion failure must
      # not cancel the Release leg (or vice versa) and leave the actual /WX or
      # optimizer status unknown.
      fail-fast: false
      matrix:
        config: [Release, Debug]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Compute deps root
        run: |
          $depsRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'deps'
          "DEPS_ROOT=$depsRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Key is intentionally NOT matrix-scoped: spdlog, nlohmann-json and Catch2
      # are header/source drops with no per-configuration content, so both legs
      # want the identical cache. On a cold cache both legs race to save it and
      # the loser logs "Unable to reserve cache ... another job may be creating
      # this cache" — a warning, not a failure, and the next run hits the cache
      # either way. Do not "fix" it by adding ${{ matrix.config }} to the key:
      # that would double the cache footprint to store two identical copies.
      - name: Cache dependencies
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPS_ROOT }}
          key: deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      # Pinned to the exact versions used locally (see Directory.Build.props / CLAUDE.md).
      - name: Fetch spdlog
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v1.16.0 https://github.com/gabime/spdlog "$env:DEPS_ROOT\spdlog"

      - name: Fetch nlohmann-json
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch v3.12.0 https://github.com/nlohmann/json "$env:DEPS_ROOT\json"

      - name: Fetch Catch2 (amalgamated)
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v3.13.0 https://github.com/catchorg/Catch2 "$env:RUNNER_TEMP\Catch2Src"
          New-Item -ItemType Directory -Force -Path "$env:DEPS_ROOT\Catch2" | Out-Null
          Copy-Item "$env:RUNNER_TEMP\Catch2Src\extras\catch_amalgamated.hpp" "$env:DEPS_ROOT\Catch2\"
          Copy-Item "$env:RUNNER_TEMP\Catch2Src\extras\catch_amalgamated.cpp" "$env:DEPS_ROOT\Catch2\"

      # Directory.Build.user.props is the documented, gitignored override mechanism
      # for DepsRoot (see Directory.Build.user.props.example) — nothing committed.
      - name: Point build at deps
        run: |
          @"
          <?xml version="1.0" encoding="utf-8"?>
          <Project>
            <PropertyGroup>
              <DepsRoot>$env:DEPS_ROOT\</DepsRoot>
            </PropertyGroup>
          </Project>
          "@ | Set-Content -Path 'Directory.Build.user.props'

      # tests-only, not "all": this job never runs StratChessEvolved.exe, and the
      # main app project has WholeProgramOptimization (LTCG) enabled for Release|x64
      # while the test project deliberately doesn't — building "all" wasted the
      # majority of the ~12min first-run time on an LTCG link of an unused binary.
      - name: Build
        run: .\build.ps1 tests -Config ${{ matrix.config }}

      # Same '~[slow]' filter in both configs, deliberately: the two legs must
      # cover the same cases, since the point is that they disagree about which
      # of those cases fail, not about which run.
      - name: Run fast tests
        run: |
          & ".\StratChessTests\x64\${{ matrix.config }}\StratChessTests.exe" '~[slow]'
          exit $LASTEXITCODE

  # Branch protection requires a single always-present check, and this is it --
  # the name must not change. Linux is the gate: it runs on every PR, so a PR is
  # mergeable on Linux alone.
  # Windows is advisory in the sense that being SKIPPED is fine, but a Windows
  # job that actually ran and failed still blocks -- an MSVC-only regression
  # (e.g. a Release-only C4189 under /WX) must not merge unnoticed.
  build-and-test-result:
    needs: [classify, build-linux, build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          echo "tier=${{ needs.classify.outputs.tier }}"
          echo "linux result=${{ needs.build-linux.result }}"
          echo "windows result=${{ needs.build-and-test.result }}"

          case "${{ needs.classify.result }}" in
            success) ;;
            *) echo "Classification did not succeed; cannot certify this run."; exit 1 ;;
          esac

          case "${{ needs.build-linux.result }}" in
            success) echo "Linux build and tests passed." ;;
            skipped) echo "Linux skipped: '${{ needs.classify.outputs.tier }}' tier cannot affect the build." ;;
            *)       echo "Linux build and tests did not pass."; exit 1 ;;
          esac

          case "${{ needs.build-and-test.result }}" in
            success) echo "Windows build and tests passed." ;;
            skipped) echo "Windows skipped: demoted to nightly / 'windows-ci' label." ;;
            *)       echo "Windows build and tests did not pass."; exit 1 ;;
          esac

          exit 0
