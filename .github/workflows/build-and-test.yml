name: Build and test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

# Supersede in-flight runs for the same ref. Minutes are free on a public
# repository, but the 20-job concurrency ceiling is shared across the whole
# account, so a superseded run still costs the next one its start slot. Pushes to
# main are exempt: every merge deserves its own completed verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every Linux job below pins ubuntu-24.04, whose image ships Ninja and CMake on
# PATH -- `-G Ninja` needs no install step. Do not add one: it puts an Ubuntu apt
# mirror on the critical path of every job, and a stalled mirror hangs `apt-get
# update` indefinitely. A job on a different image must confirm this first.
#
# Every job sets timeout-minutes. The GitHub default is 6 hours, which a hung
# network step burns in full while the required check sits pending. The values
# are well above normal runtime -- they exist to catch a hang, not a slow runner.
jobs:
  # Decide how much validation this diff is worth, using the SAME classifier the
  # local pre-PR script uses (StratChessEvolved/Scripts/Get-ChangeTier.ps1) -- one
  # definition, so CI and the local convention cannot drift apart. See issue #124
  # and .claude/plans/validation-change-tiers.md.
  #
  # Needs fetch-depth: 0 because the default shallow single-commit checkout makes
  # the base-ref diff impossible. This is why classification is its own small job:
  # build-and-test keeps its cheap shallow checkout.
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    outputs:
      tier: ${{ steps.tier.outputs.tier }}
      is_full: ${{ steps.tier.outputs.is_full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Lives in classify because classify is the one job with no tier condition:
      # a workflow edit is Build tier today, but a guard that can be skipped is
      # not a guard. The self-test runs first, so a broken detector fails loudly
      # instead of passing everything.
      - name: Check workflow job timeouts
        run: |
          pwsh -NoProfile -File StratChessEvolved/Scripts/Test-WorkflowTimeouts.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File StratChessEvolved/Scripts/Test-WorkflowTimeouts.ps1
          exit $LASTEXITCODE

      - name: Classify changed files
        id: tier
        env:
          # A pull request compares against origin/main. A push cannot: on a push
          # to main, origin/main IS HEAD, so that diff is empty -- and an empty
          # diff correctly returns the weakest tier, which made every merge
          # classify as Docs no matter what it contained (issue #185).
          #
          # github.event.before is the tip main held before the push. For this
          # repo's shape -- one merge commit per push -- that is the previous main
          # tip, and unlike HEAD^ it stays correct if a push ever carries several
          # commits.
          #
          # If the ref is unreachable (force push, or the all-zeros SHA on branch
          # creation) the diff fails and Get-ChangeTier.ps1 returns Engine tier.
          # That fail-closed path is deliberate: do not add a fallback that
          # guesses something cheaper.
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          $c = & .\StratChessEvolved\Scripts\Get-ChangeTier.ps1 -BaseRef $env:BASE_REF
          Write-Host "Change tier: $($c.Tier) (decided by: $($c.DecidingFile))"
          Write-Host "Changed files:"
          $c.ChangedFiles | ForEach-Object { Write-Host "  $_" }
          "tier=$($c.Tier)" | Out-File $env:GITHUB_OUTPUT -Append
          "is_full=$($c.IsFull.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append

  build-linux:
    needs: classify
    # Tier-gated on both events now that classify can read a push (#185). A Docs
    # or Tooling merge to main runs nothing, because by definition nothing it
    # contains can affect the build.
    if: needs.classify.outputs.is_full == 'true'
    # Pinned to the exact image (not the moving ubuntu-latest label) — the code
    # needs GCC >= 13 for std::format, matching the Windows job's pinning approach.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Release and Debug are not redundant -- the same asymmetry documented for the
    # Windows job in issue #146 is compiler-independent. Debug keeps assert() and
    # the #ifndef NDEBUG bitboard/mailbox tripwire in Eval.cpp live; Release is the
    # only leg that runs the optimizer. Two Linux legs at 1x still bill less than
    # one Windows leg at 2x.
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    # Per-configuration ccache cap (D3 below); 400M x 4 configurations across the
    # whole workflow totals about 1.6 GB against the repository-wide 10 GB cache
    # budget.
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      # Keyed on the pinned dependency tags, matching the Windows job's approach.
      # Not matrix-scoped: FetchContent sources have no per-configuration content,
      # so both legs want the identical cache.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.15.3

      # ccache in front of the compiler. The install rationale, the bump policy and
      # why the object cache is keyed per configuration all live in the composite
      # action. Note the key varies by matrix leg where the FetchContent key above
      # deliberately does not: those sources are identical across configurations,
      # these compiler command lines are not.
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-${{ matrix.config == 'Release' && 'release' || 'debug' }}

      # The launcher flag is appended only when the install step above succeeded.
      # `-DCMAKE_CXX_COMPILER_LAUNCHER=ccache` configures happily even when ccache
      # is missing -- CMake does not check that the launcher exists -- and only
      # then fails at the first Ninja edge with "ccache: not found". Dropping the
      # flag here is the other half of the D6 fallback, not optional cleanup:
      # without it, a failed install turns an accelerator outage into a build
      # failure.
      - name: Configure
        run: |
          LAUNCHER=""
          if [ "${{ steps.ccache.outputs.available }}" = "true" ]; then
            LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }} $LAUNCHER

      # Zeroed immediately before the build, not read cold: ccache's counters are
      # cumulative and are restored along with the cache directory above, so
      # without this the numbers `show-stats` prints after the build would be the
      # sum over every run that ever populated this entry, and the per-run hit
      # rate could never be read out of them.
      - name: Zero ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --zero-stats

      # "all", matching the Windows job: StratChessEvolved.cpp -- main() and the
      # perft/tactical/eval runners -- is in no other target, so a tests-only
      # build never compiles it with GCC. It also exercises the GCC LTO link,
      # since INTERPROCEDURAL_OPTIMIZATION_RELEASE is not MSVC-specific. ccache
      # caches compilation, not that link, so on the Release leg the LTO link
      # stays on the critical path in full and caps what ccache buys here.
      - name: Build
        run: cmake --build build --parallel

      - name: Show ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --show-stats

      # Same '~[slow]' filter as the Windows job, deliberately: the legs must
      # cover the same cases. The fast tier is self-contained -- no Catch2 test
      # reads Tests/*.json -- so the working directory does not matter here.
      - name: Run fast tests
        run: ./build/StratChessTests '~[slow]'

      # The Catch2 tier hard-codes seven cases (startpos d1-4, Kiwipete d1-3).
      # This is the 131-position suite behind Tests/perft_test_cases.json, 655
      # node-count checks, and it ran in no automated gate before. Perft is
      # self-checking, so breadth across positions catches move-generation faults
      # that more depth on one position cannot.
      #
      # RELEASE ONLY, and not for tidiness: perft is compute-bound and an
      # unoptimised build is unusable for it. The Release leg runs the suite in
      # 30 s; the Debug leg managed 4 of the 131 positions in six minutes, which
      # extrapolates to about three hours. Move generation is the same code in
      # both configurations, and the Catch2 [perft] cases already cover the
      # shallow depths under Debug with assert() live.
      #
      # Runs from Tests/: the runner resolves perft_test_cases.json relative to
      # the working directory.
      - name: Perft suite
        if: matrix.config == 'Release'
        working-directory: Tests
        run: ../build/StratChessEvolved perft test

  # ASan + UBSan over the fast tier. See issue #179.
  #
  # Why it earns a job of its own rather than a third leg of the matrix above:
  # it is the only one that can catch a *silent* fault. The engine indexes raw
  # fixed-size arrays with computed values everywhere -- the 64 x 4096 magic
  # tables, the PSTs, ThreadData's killer/history tables, Board's mailbox -- and
  # an out-of-bounds read there does not crash. It returns a wrong evaluation,
  # which then gets credited to whatever change is under test.
  #
  # Debug, not Release: assert() and the #ifndef NDEBUG tripwires stay live and
  # catch a different class of fault than the sanitizers do, so one Debug leg is
  # worth more than one Release leg. Linux-only -- the GNU -fsanitize= spelling
  # does not survive the MSVC driver, and CMakeLists.txt refuses it there rather
  # than producing an uninstrumented binary that looks instrumented.
  #
  # Cost: one extra 1x job, seconds of test execution even at ASan's slowdown.
  sanitize-linux:
    needs: classify
    # Same condition as build-linux, deliberately shared rather than narrowed to
    # the Engine tier: a Build-tier change to CMakeLists.txt is exactly what can
    # break the sanitizer wiring, and two conditions would eventually drift.
    if: needs.classify.outputs.is_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      # Same key as build-linux: FetchContent sources are identical whatever the
      # build type or instrumentation, so this shares that job's cache entry.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.15.3

      # ccache in front of the compiler. The install rationale, the bump policy and
      # why the object cache is keyed per configuration all live in the composite
      # action; the key below is this job's configuration.
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-asan-ubsan-stdlibdebug

      # STRAT_SANITIZE_RECOVER is left at its OFF default on purpose: sanitizers
      # report and continue otherwise, which exits 0 and would turn this job green
      # with the findings sitting in the log.
      #
      # STRAT_STDLIB_DEBUG adds libstdc++ debug mode: checked iterators and
      # container preconditions, which _GLIBCXX_ASSERTIONS (bounds only) misses.
      # The whole instrumented suite runs in ~25 s, so it is affordable on a
      # required check.
      #
      # The launcher flag is dropped when the install above failed -- see D6 on
      # build-linux's Configure step for why this is not optional cleanup.
      - name: Configure
        run: |
          LAUNCHER=""
          if [ "${{ steps.ccache.outputs.available }}" = "true" ]; then
            LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTRAT_SANITIZE=address,undefined \
            -DSTRAT_STDLIB_DEBUG=ON \
            $LAUNCHER

      # Zeroed before the build for the same reason as build-linux's equivalent
      # step: ccache's counters are cumulative and restored with the cache
      # directory, so without this the hit rate printed after the build is not
      # readable as a per-run figure.
      - name: Zero ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --zero-stats

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      - name: Show ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --show-stats

      # Same '~[slow]' filter as every other leg. The fast tier already runs perft
      # to depth 4 from the start position and depth 3 from Kiwipete, which is the
      # densest exercise of move generation in the suite.
      - name: Run fast tests
        run: ./build/StratChessTests '~[slow]'

  # TSan covers the one thing ASan cannot: a data race in the Lazy SMP helpers
  # that has not yet corrupted anything. It is a separate job because TSan and
  # ASan cannot be combined at link time.
  #
  # This job deliberately does NOT run the Catch2 tier. The `[smp]` tests only
  # check SetThreads() clamping and the rest of the tier is single-threaded, so a
  # TSan run over it spawns no helpers and cannot fail for the reason this job
  # exists -- and sanitize-linux already runs that tier under ASan/UBSan. Building
  # only the engine keeps this inside the wall-clock set by build-linux (Release),
  # so it costs runner minutes rather than PR feedback time.
  #
  # Survey, positive control and the cost measurements: .claude/plans/tsan-lazy-smp.md.
  tsan-linux:
    needs: classify
    # Same condition as build-linux and sanitize-linux, for the same reason: a
    # Build-tier change to CMakeLists.txt is what breaks sanitizer wiring.
    if: needs.classify.outputs.is_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.15.3

      # ccache in front of the compiler. The install rationale, the bump policy and
      # why the object cache is keyed per configuration all live in the composite
      # action; the key below is this job's configuration.
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-tsan

      # STRAT_SANITIZE_RECOVER stays at its OFF default: a report must abort the
      # process and fail the job, not print and exit 0.
      #
      # STRAT_STDLIB_DEBUG is deliberately absent. It changes the container ABI,
      # and its value (checked iterators) is already covered by sanitize-linux;
      # adding it here would only slow the instrumented build.
      #
      # The launcher flag is dropped when the install above failed -- see D6 on
      # build-linux's Configure step for why this is not optional cleanup.
      - name: Configure
        run: |
          LAUNCHER=""
          if [ "${{ steps.ccache.outputs.available }}" = "true" ]; then
            LAUNCHER="-DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
          fi
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTRAT_SANITIZE=thread \
            $LAUNCHER

      # Zeroed before the build for the same reason as build-linux's equivalent
      # step: ccache's counters are cumulative and restored with the cache
      # directory, so without this the hit rate printed after the build is not
      # readable as a per-run figure.
      - name: Zero ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --zero-stats

      - name: Build engine
        run: cmake --build build --target StratChessEvolved --parallel

      - name: Show ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --show-stats

      # setarch -R disables ASLR. Ubuntu 24.04 raises vm.mmap_rnd_bits beyond what
      # TSan's shadow mapping tolerates, and without this the process dies with
      # "FATAL: ThreadSanitizer: unexpected memory mapping" before main -- which
      # reports zero races while running none of the search.
      - name: Drive multi-threaded searches
        working-directory: StratChessEvolved
        run: setarch $(uname -m) -R python3 ../.github/scripts/tsan_smp_drive.py ../build/StratChessEvolved

  build-and-test:
    needs: classify
    # The only job that builds what actually ships: the clang-cl branch of
    # strat_configure_target, the eight _MSC_VER/_WIN32 sites across Compat.h,
    # PieceHelper.h, SquareHelper.h and StdAfx.h, the MSVC standard library, and
    # lld-link/ThinLTO. Two of the three clang-cl flag spellings fail SILENTLY
    # when wrong (#84), so no Linux leg can stand in for it.
    #
    # Validate-PrePR.ps1 does not cover this job: it never passes -Config, so it
    # builds Release only and never compiles Debug at all.
    if: needs.classify.outputs.is_full == 'true'
    # Pinned to the explicit VS2026 image (not the moving windows-latest label) —
    # keeps the toolchain fixed until it is changed deliberately.
    # See .claude/plans/full-build-test-ci-github-actions.md.
    runs-on: windows-2025-vs2026
    timeout-minutes: 30
    # Release and Debug are NOT redundant -- each catches a class of failure the
    # other structurally cannot, so both are required (see issue #146):
    #
    #   Debug   -- assert() is live, so DoMove's move/side-to-move invariants and
    #              the #ifndef NDEBUG tripwires (e.g. Eval.cpp's bitboard/mailbox
    #              consistency check in BuildContext) actually execute. Release
    #              compiles all of them out and silently tolerates the OOB reads
    #              they exist to catch.
    #   Release -- NDEBUG elides assert(), which turns any variable used *only*
    #              inside one into an unreferenced local: C4189 under this
    #              project's Level4 + /WX, i.e. a build error that exists in
    #              Release only. (This is why CLAUDE.md lists [[maybe_unused]] as
    #              an approved suppression.) It is also the only leg where the
    #              optimizer runs, and the only one that builds what ships.
    #
    # The legs run on separate runners in parallel, so this costs runner minutes
    # but effectively no wall-clock on PR feedback. Debug test *execution* is
    # ~3x slower than Release but that is ~4s vs ~1s on the fast tier -- the cost
    # here is the second build, not the second test run.
    strategy:
      # Both legs must report independently: a Debug-only assertion failure must
      # not cancel the Release leg (or vice versa) and leave the actual /WX or
      # optimizer status unknown.
      fail-fast: false
      matrix:
        config: [Release, Debug]
    defaults:
      run:
        shell: pwsh
    # Matches the per-configuration cap the Linux jobs use. Both legs cache, so the six
    # entries across the workflow total about 2.4 GB against the repository-wide 10 GB
    # budget shared with the FetchContent caches.
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      # Every Windows preset points FETCHCONTENT_BASE_DIR at build/_deps, so the
      # Release and Debug legs share one dependency clone and one cache entry.
      #
      # The key is intentionally NOT matrix-scoped: the FetchContent sources are
      # identical across configurations. On a cold cache both legs race to save it
      # and the loser logs "Unable to reserve cache ... another job may be creating
      # this cache" — a warning, not a failure, and the next run hits the cache
      # either way. Do not "fix" it by adding ${{ matrix.config }} to the key:
      # that would store two identical copies.
      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: win-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.15.3

      # BOTH legs (#380). Release was cached first (#377) and moved the job by only
      # ~5 s, because this is a two-leg matrix and both legs must finish -- so the
      # job's duration is the slower one, and caching one leg just hands the floor
      # to the other. Debug became cacheable once CMakeLists.txt switched it to /Z7:
      # ccache cannot cache /Zi.
      #
      # One key per configuration, never shared, for the reason the composite action
      # records: hit rate and eviction, not correctness.
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-windows-clang-cl-${{ matrix.config == 'Release' && 'release' || 'debug' }}

      - name: Zero ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --zero-stats

      # "all", not tests-only: INTERPROCEDURAL_OPTIMIZATION_RELEASE is set on the
      # StratChessEvolved target alone, so a tests-only build never performs the
      # ThinLTO link that ships.
      #
      # build.ps1 imports the VS developer environment itself, so no separate
      # setup step is needed here. It defaults to clang-cl, which is what ships;
      # if a runner image ever lacks the VS Clang component, `-Compiler msvc` is
      # the one-word fallback and build.ps1 says so by name.
      #
      # The launcher reaches CMake as an environment variable rather than a -D,
      # because build.ps1 drives a preset and takes no pass-through for cache
      # variables -- CMake initialises CMAKE_<LANG>_COMPILER_LAUNCHER from the
      # environment at first configure. Growing build.ps1's parameter surface for
      # a CI-only need would be the worse trade: it is the wrapper every developer,
      # the pre-commit hook and every measurement script goes through.
      #
      # The empty-string branch is the other half of the D6 fallback, not optional
      # cleanup. CMake does not check that a launcher exists, so setting this
      # against a missing ccache configures happily and then fails at the first
      # Ninja edge with "ccache: not found" -- turning an accelerator outage into
      # a build failure.
      - name: Build
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.ccache.outputs.available == 'true' && 'ccache' || '' }}
        run: .\build.ps1 all -Config ${{ matrix.config }}

      - name: Show ccache stats
        if: steps.ccache.outputs.available == 'true'
        run: ccache --show-stats

      # Same '~[slow]' filter in both configs, deliberately: the two legs must
      # cover the same cases, since the point is that they disagree about which
      # of those cases fail, not about which run.
      - name: Run fast tests
        run: |
          $exe = .\StratChessEvolved\Scripts\Get-BuildArtifact.ps1 -Target StratChessTests -Config ${{ matrix.config }}
          & $exe '~[slow]'
          exit $LASTEXITCODE

  # Required formatting and fast clang-tidy Gate checks over changed C++ sources.
  # The shared PowerShell runner keeps local PrePR and CI behavior identical.
  #
  # Seventh parallel job after classify. The critical path is build-linux (Release)
  # at ~260 s; linting the 1-5 files a PR usually touches lands far below that, so
  # this costs runner minutes and no PR feedback time. tsan-linux is the precedent.
  lint-linux:
    needs: classify
    # Same condition as every other build job, shared rather than narrowed: a
    # Build-tier change to CMakeLists.txt is exactly what breaks the compile
    # database this job depends on.
    if: needs.classify.outputs.is_full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LLVM_MAJOR: "22"
    steps:
      - uses: actions/checkout@v7
        with:
          # The changed-file list needs history: a default shallow checkout cannot
          # resolve origin/main...HEAD. Same reason classify sets this.
          fetch-depth: 0

      # Pinned major, not ubuntu-24.04's default clang-tidy-18. The check inventory
      # differs between clang-tidy majors, so an unpinned runner silently gains and
      # loses checks when the image moves. A version gap between a developer's
      # toolchain and CI produces "clean locally, red in CI" with no visible cause.
      #
      # LLVM 22 is what Visual Studio 18 ships, so developers already have it.
      # clang-format output was verified byte-identical between 22.1.3 (VS) and
      # 22.1.8 (apt.llvm.org) across all 93 sources, which is what makes the
      # blocking format check safe.
      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        # The only step here that depends on an apt mirror. Bounded so a
        # stalled mirror fails the step instead of hanging to the job ceiling.
        timeout-minutes: 10
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_MAJOR"
          sudo apt-get install -y "clang-tidy-$LLVM_MAJOR" "clang-format-$LLVM_MAJOR"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.15.3

      # Configured with clang, NOT the default GCC, and this is load-bearing.
      # strat_configure_target emits the GNU spelling -fconstexpr-ops-limit= for GCC
      # and -fconstexpr-steps= for Clang. clang-tidy is LibTooling: it consumes the
      # database's arguments through the clang driver, which rejects the GNU spelling
      # as an unknown argument. Against a GCC database every translation unit fails to
      # parse; the shared runner treats that as an infrastructure failure.
      #
      # Release and non-sanitized: the sanitizer and stdlib-debug configurations
      # change which macros are live and would report findings that do not apply to a
      # shipping build.
      - name: Configure lint database
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-$LLVM_MAJOR
          -DCMAKE_CXX_COMPILER=clang++-$LLVM_MAJOR

      - name: Validate lint scripts
        shell: pwsh
        run: |
          pwsh -NoProfile -File StratChessEvolved/Scripts/New-TidyCompileDatabase.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pwsh -NoProfile -File StratChessEvolved/Scripts/Run-Lint.ps1 -SelfTest
          exit $LASTEXITCODE

      - name: clang-format (blocking)
        shell: pwsh
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          $format = (Get-Command "clang-format-$env:LLVM_MAJOR").Source
          pwsh -NoProfile -File StratChessEvolved/Scripts/Run-Lint.ps1 `
            -Check Format -BaseRef $env:BASE_REF -ClangFormat $format
          exit $LASTEXITCODE

      # Changed .cpp files only; header-only changes are covered by Nightly's
      # whole-tree Gate. The runner fails closed on database or worker errors.
      - name: clang-tidy Gate (blocking)
        shell: pwsh
        env:
          BASE_REF: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: |
          $tidy = (Get-Command "clang-tidy-$env:LLVM_MAJOR").Source
          pwsh -NoProfile -File StratChessEvolved/Scripts/Run-Lint.ps1 `
            -Check Tidy -Profile Gate -BaseRef $env:BASE_REF `
            -BuildDirectory build -ClangTidy $tidy -Jobs 4
          exit $LASTEXITCODE

  # The single always-present check, and the name must not change.
  #
  # This is the required status check on main: a red run blocks the merge.
  #
  # Every leg runs for Build- and Engine-tier changes, on pull requests and merges
  # alike. Docs and Tooling changes skip all of them, and SKIPPED is reported as
  # success on purpose -- a required check that never runs would block those PRs
  # forever.
  build-and-test-result:
    needs: [classify, build-linux, sanitize-linux, tsan-linux, build-and-test, lint-linux]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report
        shell: bash
        run: |
          echo "tier=${{ needs.classify.outputs.tier }}"
          echo "linux result=${{ needs.build-linux.result }}"
          echo "sanitizer result=${{ needs.sanitize-linux.result }}"
          echo "tsan result=${{ needs.tsan-linux.result }}"
          echo "windows result=${{ needs.build-and-test.result }}"
          echo "lint result=${{ needs.lint-linux.result }}"

          # One shape for every leg. 'cancelled' is called out separately because a
          # job killed by timeout-minutes reports exactly that -- GitHub's
          # needs.<job>.result vocabulary is success/failure/cancelled/skipped with
          # no distinct timed-out state, so a manual cancel, a supersede and a time
          # bound are indistinguishable here. What they share is the part worth
          # saying: the job never finished, so this is not a verdict on the diff.
          # Reading a clean diff for a fault that was never in it is the cost of
          # reporting it as a plain failure. Still exit 1 -- unverified is not passed.
          verdict() {
            local label="$1" result="$2" pass="$3" fail="$4"
            case "$result" in
              success)   echo "$pass" ;;
              skipped)   echo "$label skipped: '${{ needs.classify.outputs.tier }}' tier cannot affect the build." ;;
              cancelled) echo "$label was cancelled or hit its time bound. Nothing is known about the diff from this leg; re-run before investigating it."; return 1 ;;
              *)         echo "$fail"; return 1 ;;
            esac
          }

          case "${{ needs.classify.result }}" in
            success) ;;
            *) echo "Classification did not succeed; cannot certify this run."; exit 1 ;;
          esac

          verdict "Linux" "${{ needs.build-linux.result }}" \
            "Linux build and tests passed." \
            "Linux build and tests did not pass." || exit 1

          verdict "Sanitizers" "${{ needs.sanitize-linux.result }}" \
            "ASan/UBSan build and tests passed." \
            "ASan/UBSan reported a finding, or the instrumented build failed." || exit 1

          verdict "TSan" "${{ needs.tsan-linux.result }}" \
            "TSan multi-threaded search passed." \
            "TSan reported a data race, or the instrumented build failed." || exit 1

          verdict "Windows" "${{ needs.build-and-test.result }}" \
            "Windows build and tests passed." \
            "Windows build and tests did not pass." || exit 1

          verdict "Lint" "${{ needs.lint-linux.result }}" \
            "Required clang-format and clang-tidy Gate checks passed." \
            "Lint failed: formatting, clang-tidy findings, or lint infrastructure did not pass." || exit 1

          exit 0
