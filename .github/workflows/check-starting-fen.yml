name: Check starting FEN
# Path-filtered rather than tier-gated. game_settings.json classifies as Engine,
# so tier gating would still fire this on every engine PR while adding a classify
# dependency of its own -- a minute spent to save a minute. This runs only when
# the file it guards actually changes.
#
# A paths filter on a *required* check leaves a PR waiting on a status that never
# arrives. That is safe here only because required status checks are unavailable
# on this plan (they need GitHub Pro on a private repo). Revisit if branch
# protection is ever enabled.
on:
  pull_request:
    branches: [main]
    paths:
      - 'StratChessEvolved/game_settings.json'
jobs:
  check-fen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify starting FEN
        shell: bash
        run: |
          FEN='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1'
          FILE='StratChessEvolved/game_settings.json'
          # The file is JSONC and its "Alternative FEN positions" block is a commented
          # copy of the active "FEN": line. Strip comments first: matching the raw text
          # finds that copy and passes whatever the active FEN says, which is the one
          # situation this check exists to catch. Mirrors Validate-PreCommit.ps1.
          ACTIVE=$(perl -0777 -pe 's{/\*.*?\*/}{}gs; s{//.*$}{}gm' "$FILE")
          if ! printf '%s' "$ACTIVE" | grep -qE "\"FEN\"[[:space:]]*:[[:space:]]*\"${FEN}\""; then
            echo "::error file=$FILE::Active FEN is not the starting position. Expected: $FEN"
            exit 1
          fi
          echo "PASS: FEN is at starting position."
