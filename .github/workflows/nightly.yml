name: Nightly

# Everything too slow for the per-PR gate but cheap enough to run daily now that
# public standard runners are free. Nothing here blocks a merge -- these jobs
# answer "is main still correct?", not "may this land?".
on:
  schedule:
    # UTC. Off the hour on purpose: GitHub queues scheduled runs and delays the
    # top-of-hour rush most.
    - cron: "23 1 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

# Every Linux job below pins ubuntu-26.04, which ships Ninja, CMake and LLVM 22
# on PATH -- no job needs an install step. Do not add one: it puts an apt mirror
# on the critical path of every job, and a stalled mirror hangs `apt-get update`
# indefinitely. A job on a different image must confirm this first.
#
# Every job sets timeout-minutes. The GitHub default is 6 hours, which a hung
# network step burns in full before anyone sees a verdict. The values are well
# above normal runtime -- they exist to catch a hang, not a slow runner.
#
# Every build reuses the matching build-and-test.yml ccache key unless its job
# says why not (extended-tests Debug, coverage), so a scheduled
# run on main restores the objects main's last push already compiled. A key here
# must describe the same compiler command line as its PR-side namesake; the
# launcher is dropped when ccache is unavailable, as build-and-test.yml's D6 notes.
jobs:
  # Perft is self-checking: a corrupted make/unmake or a mailbox/bitboard desync
  # shows up as a wrong node count without any assertion having to catch it. The
  # fast tier stops at depth 4, which these depths dwarf.
  #
  # Measured locally at ~50 Mnps: startpos depth 7 is ~63 s and Kiwipete depth 6
  # ~2.8 min, so both fit one job even several times slower on a runner. They are
  # separate matrix legs to report independently, not to make them fit.
  deep-perft:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: startpos-depth-7
            depth: 7
            fen: ""
            expected: 3195901860
          - name: kiwipete-depth-6
            depth: 6
            fen: "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"
            expected: 8031647685
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-gcc15-release

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ${{ steps.ccache.outputs.available == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --target StratChessEvolved --parallel

      # `perft run` prints the count but does not verify it, so the comparison
      # against the known-correct value happens here.
      - name: Perft ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build/StratChessEvolved perft run ${{ matrix.depth }} ${{ matrix.fen && format('"{0}"', matrix.fen) || '' }} | tee out.txt
          actual=$(grep -oP '^Nodes:\s*\K[0-9]+' out.txt)
          echo "expected=${{ matrix.expected }} actual=$actual"
          test "$actual" = "${{ matrix.expected }}"

  # The [slow] tier: a handful of deep tactical, null-move and endgame-conversion
  # cases. It is a thin tier, not a second suite, so treat a green run as weak evidence.
  # Self-contained: no test reads anything from Tests/.
  #
  # The Debug leg deliberately skips ccache: it is the one daily from-scratch build,
  # so a wrong object served from the cache cannot hide in every build at once.
  extended-tests:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Set up ccache
        if: matrix.config == 'Release'
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-gcc15-release

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          ${{ steps.ccache.outputs.available == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      - name: Run every test including [slow]
        run: ./build/StratChessTests

  # The same instrumentation the per-PR sanitize-linux job runs -- ASan+UBSan plus
  # libstdc++ debug mode -- extended to the [slow] tier it excludes.
  sanitize-extended:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CCACHE_MAXSIZE: 600M
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-gcc15-asan-ubsan-stdlibdebug

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSTRAT_SANITIZE=address,undefined
          -DSTRAT_STDLIB_DEBUG=ON
          ${{ steps.ccache.outputs.available == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      - name: Run every test including [slow]
        run: ./build/StratChessTests

  # Ten times the local run's repetitions. Stability mode re-runs the suite and
  # fails on any position whose pass/fail flips, which is the cheap detector for
  # nondeterminism in a search that shares a TT across threads.
  #
  # Must run from Tests/: the runner resolves tactical_test_cases.json relative to
  # the working directory.
  tactical-stability:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-linux-gcc15-release

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          ${{ steps.ccache.outputs.available == 'true' && '-DCMAKE_CXX_COMPILER_LAUNCHER=ccache' || '' }}

      - name: Build
        run: cmake --build build --target StratChessEvolved --parallel

      # spdlog fails silently when its log directory is missing.
      - name: Tactical stability x100
        working-directory: Tests
        run: |
          mkdir -p logs
          ../build/StratChessEvolved tactical stability 100

  # Whole-tree format and fast Gate checks, reaching what the PR job's
  # one-unit-per-header cover does not.
  lint-tree:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      LLVM_MAJOR: "22"
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      # clang, not the default GCC: a GCC database carries -fconstexpr-ops-limit=,
      # which the clang driver rejects, and every TU then fails to parse. See the
      # lint-linux job in build-and-test.yml.
      - name: Configure lint database
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-$LLVM_MAJOR
          -DCMAKE_CXX_COMPILER=clang++-$LLVM_MAJOR

      - name: Validate lint scripts
        shell: pwsh
        # In-process, so the step's $ErrorActionPreference = 'stop' fails a self-test on any error.
        run: |
          & ./Scripts/New-TidyCompileDatabase.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Scripts/Run-Lint.ps1 -SelfTest
          exit $LASTEXITCODE

      - name: clang-format over the whole tree (blocking)
        shell: pwsh
        run: |
          $format = (Get-Command "clang-format-$env:LLVM_MAJOR").Source
          pwsh -NoProfile -File Scripts/Run-Lint.ps1 `
            -Check Format -All -ClangFormat $format
          exit $LASTEXITCODE

      - name: clang-tidy Gate over the whole tree (blocking)
        shell: pwsh
        run: |
          $tidy = (Get-Command "clang-tidy-$env:LLVM_MAJOR").Source
          pwsh -NoProfile -File Scripts/Run-Lint.ps1 `
            -Check Tidy -Profile Gate -All -BuildDirectory build `
            -ClangTidy $tidy -Jobs 4
          exit $LASTEXITCODE

  # Analyzer-heavy checks stay off the required PR path and fail Nightly instead.
  lint-deep-linux:
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      LLVM_MAJOR: "22"
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Configure lint database
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-$LLVM_MAJOR
          -DCMAKE_CXX_COMPILER=clang++-$LLVM_MAJOR

      - name: clang-tidy Deep on shipping sources (blocking)
        shell: pwsh
        run: |
          $tidy = (Get-Command "clang-tidy-$env:LLVM_MAJOR").Source
          pwsh -NoProfile -File Scripts/Run-Lint.ps1 `
            -Check Tidy -Profile Deep -All -BuildDirectory build `
            -ClangTidy $tidy -Jobs 2
          exit $LASTEXITCODE

  lint-deep-windows:
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    env:
      CCACHE_MAXSIZE: 400M
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Every script self-test
        # Validate-PrePR runs only the self-tests of scripts a change touched, which is
        # right for a PR gate but leaves a script broken from elsewhere -- a renamed
        # parameter, an altered shared helper -- unnoticed until someone next edits it.
        # Windows rather than Linux because these are Windows developer tooling;
        # lint-tree keeps running the two lint-machinery self-tests it needs for its own
        # work. Pure PowerShell, so it costs seconds and fails before the heavy step.
        shell: pwsh
        run: |
          pwsh -NoProfile -File Scripts/Validate-PrePR.ps1 -AllSelfTests
          exit $LASTEXITCODE

      - name: PowerShell traps over every script
        # PRs check only the scripts they change. Two PRs can each pass that and
        # still clash once both merge, so the whole tree runs here -- even when an
        # unrelated self-test above failed.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File Scripts/Test-ScriptTraps.ps1
          exit $LASTEXITCODE

      - name: Workflow guards over every workflow
        # PRs run these only when they touch CI configuration, so a guard made
        # stricter in one PR can miss a workflow another PR added.
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          pwsh -NoProfile -File Scripts/Test-WorkflowTimeouts.ps1
          $timeoutExit = $LASTEXITCODE
          pwsh -NoProfile -File Scripts/Test-WorkflowCcachePaths.ps1
          if ($timeoutExit -ne 0) { exit $timeoutExit }
          exit $LASTEXITCODE

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Python fixture dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check python-chess==1.999 chess==1.11.2
          exit $LASTEXITCODE

      # unittest discover exits 0 even when its pattern matches nothing, so a
      # renamed or unglobbed test file would otherwise stop running silently.
      - name: Python fixture suite (unittest discovery)
        shell: pwsh
        run: |
          $count = python -c "import unittest; print(unittest.defaultTestLoader.discover('Scripts', pattern='test_*.py').countTestCases())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "discovered $count test case(s)"
          if ([int]$count -eq 0) {
            Write-Host "no tests discovered under Scripts/test_*.py" -ForegroundColor Red
            exit 1
          }
          python -m unittest discover -s Scripts -p "test_*.py" -v
          exit $LASTEXITCODE

      # build.ps1 has no configure-only verb, so this compiles the engine too;
      # ccache makes that cheap. The launcher goes in by environment for the
      # reason build-and-test.yml's Windows Build step records.
      - name: Set up ccache
        id: ccache
        uses: ./.github/actions/setup-ccache
        with:
          key: ccache-windows-clang-cl-release

      - name: Configure shipping clang-cl database
        shell: pwsh
        env:
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.ccache.outputs.available == 'true' && 'ccache' || '' }}
        run: .\build.ps1 main

      - name: clang-tidy Deep on shipping sources (blocking)
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = & $vswhere -latest -prerelease -products * -property installationPath | Select-Object -First 1
          $tidy = Join-Path $vsRoot 'VC\Tools\Llvm\x64\bin\clang-tidy.exe'
          pwsh -NoProfile -File Scripts/Run-Lint.ps1 `
            -Check Tidy -Profile Deep -All `
            -BuildDirectory build/windows-clang-cl -ClangTidy $tidy -Jobs 2
          exit $LASTEXITCODE

  # Report-only: the per-file table goes to the step summary and the annotated
  # source to an artifact. Nothing compares the number against anything, so the
  # job fails only when the build, a test or llvm-cov does.
  #
  # No ccache: the instrumented command line matches no PR-side key, so an entry
  # would serve only the next night, against the budget the other keys share.
  coverage:
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      - name: Coverage of the fast tier
        shell: pwsh
        run: |
          pwsh -NoProfile -File Scripts/Get-Coverage.ps1 `
            -Html "$env:RUNNER_TEMP/coverage-html" -Markdown $env:GITHUB_STEP_SUMMARY
          exit $LASTEXITCODE

      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-html
          path: ${{ runner.temp }}/coverage-html
          if-no-files-found: error
          retention-days: 14

  # A doc citing something that no longer resolves, or a code comment citing an issue.
  # Pure PowerShell over the checkout, so it costs seconds.
  citations:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Citations
        shell: pwsh
        run: |
          pwsh -NoProfile -File Scripts/Test-Citations.ps1
          exit $LASTEXITCODE

  nightly-result:
    needs: [deep-perft, extended-tests, sanitize-extended, tactical-stability, lint-tree, lint-deep-linux, lint-deep-windows, coverage, citations]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Report
        shell: bash
        run: |
          fail=0
          # 'cancelled' is named separately from a plain failure because a job killed
          # by timeout-minutes reports exactly that, indistinguishable from a manual
          # cancel. Either way the leg produced no answer about main, which is a
          # different thing from having produced a bad one. Both still fail the run.
          check() {
            printf '%-18s %s\n' "$1:" "$2"
            case "$2" in
              success)   ;;
              cancelled) echo "NOTE: $1 was cancelled or hit its time bound -- no verdict from this leg."; fail=1 ;;
              *)         echo "FAIL: $1 ($2)"; fail=1 ;;
            esac
          }

          check "deep perft"        "${{ needs.deep-perft.result }}"
          check "extended tests"    "${{ needs.extended-tests.result }}"
          check "sanitize+stdlib"   "${{ needs.sanitize-extended.result }}"
          check "tactical x100"     "${{ needs.tactical-stability.result }}"
          check "whole-tree lint"   "${{ needs.lint-tree.result }}"
          check "deep lint Linux"   "${{ needs.lint-deep-linux.result }}"
          check "deep lint Windows" "${{ needs.lint-deep-windows.result }}"
          check "coverage"          "${{ needs.coverage.result }}"
          check "citations"         "${{ needs.citations.result }}"
          exit $fail
