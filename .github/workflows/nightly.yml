name: Nightly

# Everything too slow for the per-PR gate but cheap enough to run daily now that
# public standard runners are free. Nothing here blocks a merge -- these jobs
# answer "is main still correct?", not "may this land?".
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  # Perft is self-checking: a corrupted make/unmake or a mailbox/bitboard desync
  # shows up as a wrong node count without any assertion having to catch it. The
  # fast tier stops at depth 4, which these depths dwarf.
  #
  # Measured locally at ~50 Mnps: startpos depth 7 is ~63 s and Kiwipete depth 6
  # ~2.8 min, so both fit one job even several times slower on a runner. They are
  # separate matrix legs to report independently, not to make them fit.
  deep-perft:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: startpos-depth-7
            depth: 7
            fen: ""
            expected: 3195901860
          - name: kiwipete-depth-6
            depth: 6
            fen: "r3k2r/p1ppqpb1/bn2pnp1/3PN3/1p2P3/2N2Q1p/PPPBBPPP/R3K2R w KQkq - 0 1"
            expected: 8031647685
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target StratChessEvolved --parallel

      # `perft run` prints the count but does not verify it, so the comparison
      # against the known-correct value happens here.
      - name: Perft ${{ matrix.name }}
        run: |
          set -o pipefail
          ./build/StratChessEvolved perft run ${{ matrix.depth }} ${{ matrix.fen && format('"{0}"', matrix.fen) || '' }} | tee out.txt
          actual=$(grep -oP '^Nodes:\s*\K[0-9]+' out.txt)
          echo "expected=${{ matrix.expected }} actual=$actual"
          test "$actual" = "${{ matrix.expected }}"

  # The [slow] tier, which is three test cases: two deep tactical searches and the
  # null-move guards. 250 test cases in the fast tier against 253 here -- it is a
  # thin tier, not a second suite, so treat a green run as weak evidence.
  # Self-contained: no test reads anything from Tests/.
  extended-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [Release, Debug]
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.config }}

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      - name: Run every test including [slow]
        run: ./build/StratChessTests

  # The same instrumentation the per-PR sanitize-linux job runs -- ASan+UBSan plus
  # libstdc++ debug mode -- extended to the [slow] tier it excludes.
  sanitize-extended:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DSTRAT_SANITIZE=address,undefined
          -DSTRAT_STDLIB_DEBUG=ON

      - name: Build
        run: cmake --build build --target StratChessTests --parallel

      - name: Run every test including [slow]
        run: ./build/StratChessTests

  # Ten times the local run's repetitions. Stability mode re-runs the suite and
  # fails on any position whose pass/fail flips, which is the cheap detector for
  # nondeterminism in a search that shares a TT across threads.
  #
  # Must run from Tests/: the runner resolves tactical_test_cases.json relative to
  # the working directory.
  tactical-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --target StratChessEvolved --parallel

      # spdlog fails silently when its log directory is missing.
      - name: Tactical stability x100
        working-directory: Tests
        run: |
          mkdir -p logs
          ../build/StratChessEvolved tactical stability 100

  # Whole-tree clang-tidy. The per-PR lint job deliberately analyses only the .cpp
  # files a pull request touches, which leaves one gap: a header is not a translation
  # unit, so a PR changing only .h files analyses nothing. Closing that gap in the PR
  # job would mean header-to-TU mapping, and a change to defines.h or StdAfx.h would
  # expand to the whole tree anyway -- which is the one shape capable of becoming the
  # critical path there. Here wall clock does not matter, so the whole tree runs.
  #
  # Advisory for findings, exactly as on a PR: the backlog is still open (#284). The
  # per-check summary doubles as the backlog trend line.
  lint-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      LLVM_MAJOR: "22"
    steps:
      - uses: actions/checkout@v7

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install LLVM ${{ env.LLVM_MAJOR }}
        run: |
          set -euo pipefail
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "$LLVM_MAJOR"
          sudo apt-get install -y "clang-tidy-$LLVM_MAJOR" "clang-format-$LLVM_MAJOR"

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      # clang, not the default GCC: a GCC database carries -fconstexpr-ops-limit=,
      # which the clang driver rejects, and every TU then fails to parse. See the
      # lint-linux job in build-and-test.yml.
      - name: Configure lint database
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-$LLVM_MAJOR
          -DCMAKE_CXX_COMPILER=clang++-$LLVM_MAJOR

      # main is format-clean by construction, so a violation here means something
      # reached main without the PR gate -- worth failing over.
      - name: clang-format over the whole tree
        run: |
          set -euo pipefail
          git ls-files '*.cpp' '*.h' | grep -v '/Archived/' > /tmp/src.txt
          echo "checking $(wc -l < /tmp/src.txt) files"
          xargs -a /tmp/src.txt "clang-format-$LLVM_MAJOR" --style=file --dry-run -Werror

      - name: clang-tidy over the whole tree (advisory)
        run: |
          set -uo pipefail
          git ls-files '*.cpp' | grep -v '/Archived/' > /tmp/tu.txt
          n=$(wc -l < /tmp/tu.txt)
          echo "translation units: $n"
          xargs -a /tmp/tu.txt -P 4 -I{} "clang-tidy-$LLVM_MAJOR" -p build --quiet {} \
            > /tmp/tidy.txt 2>&1 || true

          # A broken compile database and a clean codebase both yield zero findings.
          # Only this distinguishes them, so it fails the job rather than reporting green.
          errs=$(grep -c 'clang-diagnostic-error' /tmp/tidy.txt || true)
          if [ "$errs" -gt 0 ]; then
            echo "::error::clang-tidy hit $errs clang-diagnostic-error(s): the compile database is wrong, not the code."
            grep 'clang-diagnostic-error' /tmp/tidy.txt | head -20
            exit 1
          fi

          echo "--- findings per check (unique) ---"
          grep -oE '\[[a-z0-9.,-]+\]$' /tmp/tidy.txt | tr -d '[]' | tr ',' '\n' \
            | sort | uniq -c | sort -rn
          echo "--- total unique findings ---"
          grep -E '^\S+:[0-9]+:[0-9]+: (warning|error):' /tmp/tidy.txt | sort -u | wc -l
          echo "Advisory: findings do not fail this job until #284 lands."

  nightly-result:
    needs: [deep-perft, extended-tests, sanitize-extended, tactical-stability, lint-tree]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        shell: bash
        run: |
          echo "deep perft:        ${{ needs.deep-perft.result }}"
          echo "extended tests:    ${{ needs.extended-tests.result }}"
          echo "sanitize+stdlib:   ${{ needs.sanitize-extended.result }}"
          echo "tactical x100:     ${{ needs.tactical-stability.result }}"
          echo "whole-tree lint:   ${{ needs.lint-tree.result }}"

          fail=0
          for r in "${{ needs.deep-perft.result }}" \
                   "${{ needs.extended-tests.result }}" \
                   "${{ needs.sanitize-extended.result }}" \
                   "${{ needs.tactical-stability.result }}" \
                   "${{ needs.lint-tree.result }}"; do
            case "$r" in
              success) ;;
              *) fail=1 ;;
            esac
          done
          exit $fail
