name: Strength lab

# Differential Elo measurement in CI: candidate (the dispatched ref) against a
# reference ref, both built here from source by the same toolchain. This is a
# SECOND instrument, not a replacement for Run-EloMatch.ps1 -- Linux/GCC numbers
# are not comparable with the clang-cl rows in Docs/EloLog.md, so they are
# recorded in a separate ledger. Ratios transfer, absolute values do not.
#
# The batch is sharded across parallel matrix jobs and pooled at the end. Each
# shard plays a disjoint slice of the opening book, so the shards are one batch
# split up rather than several batches averaged.
#
# workflow_dispatch only, deliberately: a measurement harness that is wrong is
# worse than none, because its output looks exactly like a measurement. It gets
# calibrated against a null test and a known-sign control before anything
# triggers it automatically. Calibration runs are recorded in
# .claude/plans/public-repo-and-strength-lab.md and Docs/EloLog.md.
on:
  workflow_dispatch:
    inputs:
      reference_ref:
        description: "Reference side. 'merge-base' measures this ref against where it forked from main, so the result is attributable to this change alone. A tag such as elo-reference-v2 measures cumulative strength instead; the candidate's own SHA is a null test"
        default: merge-base
      games:
        description: "Total games across all shards (2 per opening pair; rounded down to fit the shards evenly)"
        default: "20000"
      shards:
        description: "Parallel match jobs. 18x1110 games is ~3 h wall-clock and leaves 2 of the 20 concurrent-job slots free, so other PRs still move; 20 consumes the whole allowance. Below ~16 a shard can exceed the job timeout"
        default: "18"
      candidate_tc:
        description: "Candidate time control, seconds+increment"
        default: "10+0.1"
      reference_tc:
        description: "Reference time control. For a known-sign control halve the BASE only (5+0.1) -- see the increment warning below"
        default: "10+0.1"
      concurrency:
        description: "Concurrent games PER SHARD. 4 vCPU per runner; validated at zero time losses at 3 -- raising it is what causes contention, not adding shards"
        default: "3"

# Never cancel a running match: a superseded build is cheap to redo, an
# interrupted multi-hour batch is an afternoon thrown away. Concurrent
# dispatches queue.
concurrency:
  group: strength-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pinned, like every other external asset this project measures with.
  FASTCHESS_VERSION: v1.8.0-alpha
  # UHO_4060_v3: 242,201 unbalanced human openings (the 4060 in the name is the
  # evaluation band the positions were selected from, not their count), i.e.
  # 484,402 distinct games -- no batch this plan contemplates can exhaust it.
  # Pinned to a commit rather than master so a re-run measures the same book.
  # Not committed to this repository: it is third-party data, and external test
  # assets live outside the checkout by convention (see M3 in
  # .claude/plans/public-repo-and-strength-lab.md).
  BOOK_URL: https://raw.githubusercontent.com/official-stockfish/books/04738d057446e749cb071d58bac39df7f13efb47/UHO_4060_v3.epd.zip
  BOOK_FILE: UHO_4060_v3.epd

jobs:
  # ---------------------------------------------------------------------------
  # Turn the requested game count into a shard plan. Doing the arithmetic once,
  # here, is what lets every later job agree on the slicing without recomputing
  # it -- and lets an impossible request fail in seconds instead of after a
  # build.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shard_list: ${{ steps.plan.outputs.shard_list }}
      rounds_per_shard: ${{ steps.plan.outputs.rounds_per_shard }}
      games_per_shard: ${{ steps.plan.outputs.games_per_shard }}
      actual_games: ${{ steps.plan.outputs.actual_games }}
      reference_sha: ${{ steps.reference.outputs.reference_sha }}
    steps:
      # fetch-depth: 0 because the reference is resolved and verified here: a
      # merge base needs history, and a tag or SHA needs its objects present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Resolving here rather than in `build` follows the same rule as the
      # pooling self-test below: a reference that does not exist costs seconds
      # now instead of failing after Ninja and a full candidate build.
      #
      # Measuring against a fixed tag cannot separate this change's delta from
      # the margin main had already accumulated, which is why the merge base is
      # the default -- see Docs/EloLog.md.
      - name: Resolve the reference
        id: reference
        env:
          REFERENCE_REF: ${{ inputs.reference_ref }}
        run: |
          set -euo pipefail
          if [ "$REFERENCE_REF" = "merge-base" ]; then
            git fetch --no-tags --quiet origin main
            if ! resolved=$(git merge-base HEAD FETCH_HEAD); then
              echo "::error::No merge base between this ref and origin/main."
              exit 1
            fi
            if [ "$resolved" = "$(git rev-parse HEAD)" ]; then
              echo "::warning::The merge base is this very commit, so both sides are identical. This run is a null test, not a measurement of a change."
            fi
          else
            resolved="$REFERENCE_REF"
          fi

          if ! sha=$(git rev-parse --verify --quiet "$resolved^{commit}"); then
            echo "::error::Reference '$REFERENCE_REF' does not resolve to a commit."
            exit 1
          fi
          echo "Reference: $REFERENCE_REF -> $sha"
          echo "reference_sha=$sha" >> "$GITHUB_OUTPUT"

      # Per-shard concurrency has to be sized off PHYSICAL cores: a
      # single-threaded search gains nothing from SMT sharing, and
      # oversubscribing adds timing noise. The match shards run on the same
      # runner label as this job, so recording the topology once here says what
      # the 4 vCPU actually are.
      - name: Record the runner's CPU topology
        run: lscpu

      # Before anything expensive. A wrong error bar is the failure mode this
      # whole milestone exists to avoid, and finding out after a three-hour
      # batch that the aggregator does not work -- or is not even present --
      # costs the batch. Checked against real fastchess output; see the script.
      - name: Verify the pooling formula
        run: python3 .github/scripts/pool_pentanomial.py --self-test

      - name: Plan the shards
        id: plan
        env:
          GAMES: ${{ inputs.games }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          case "$GAMES" in ''|*[!0-9]*) echo "::error::games must be a positive integer"; exit 1;; esac
          case "$SHARDS" in ''|*[!0-9]*) echo "::error::shards must be a positive integer"; exit 1;; esac
          test "$SHARDS" -ge 1 || { echo "::error::shards must be >= 1"; exit 1; }

          # A pair (one opening, both colours) is the indivisible unit: it is the
          # independent sample the pooled error bar is computed over, so a shard
          # boundary must never fall inside one.
          rounds_total=$(( GAMES / 2 ))
          rounds_per_shard=$(( rounds_total / SHARDS ))
          if [ "$rounds_per_shard" -lt 1 ]; then
            echo "::error::$GAMES games across $SHARDS shards leaves under one pair per shard."
            exit 1
          fi
          games_per_shard=$(( rounds_per_shard * 2 ))
          actual_games=$(( games_per_shard * SHARDS ))
          if [ "$actual_games" -ne "$GAMES" ]; then
            echo "::warning::Requested $GAMES games; playing $actual_games so every shard gets $rounds_per_shard whole pairs."
          fi

          shard_list=$(seq 0 $(( SHARDS - 1 )) | jq -sRc 'split("\n") | map(select(length > 0) | tonumber)')
          {
            echo "shard_list=$shard_list"
            echo "rounds_per_shard=$rounds_per_shard"
            echo "games_per_shard=$games_per_shard"
            echo "actual_games=$actual_games"
          } >> "$GITHUB_OUTPUT"

          echo "Plan: $SHARDS shards x $games_per_shard games = $actual_games games"

  # ---------------------------------------------------------------------------
  # Build both engines and stage the harness ONCE. Across 18 shards this saves
  # ~1 hour of duplicated runner time, but the real argument is correctness:
  # every shard must play the same two binaries against the same book. Building
  # once and shipping artifacts guarantees that; 18 independent builds only
  # assume it.
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      cand_name: ${{ steps.stage.outputs.cand_name }}
      ref_name: ${{ steps.stage.outputs.ref_name }}
      openings: ${{ steps.stage.outputs.openings }}
    steps:
      # fetch-depth: 0 for the tags and history the reference checkout needs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Same key as build-and-test.yml and nightly.yml, so this shares their
      # cache entry rather than paying for its own clone of the dependencies.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          key: cmake-deps-spdlog-v1.16.0-json-v3.12.0-catch2-v3.13.0

      # Release only. Both sides are built from the same compiler with the same
      # flags, which is the invariant every Elo number in this project depends
      # on -- a candidate and reference built by different toolchains show the
      # compiler gap as a phantom strength change (issue #84).
      - name: Build candidate
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target StratChessEvolved --parallel

      # The reference is built from its own source tree, not from a cached
      # binary: there is no Linux equivalent of EngineTesting\ here, and a
      # from-source build is what makes an arbitrary ref measurable.
      - name: Build reference (${{ inputs.reference_ref }} = ${{ needs.setup.outputs.reference_sha }})
        env:
          REFERENCE_REF: ${{ needs.setup.outputs.reference_sha }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/reference" "$REFERENCE_REF"
          cmake -S "$RUNNER_TEMP/reference" -B "$RUNNER_TEMP/reference/build" -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/reference/build" --target StratChessEvolved --parallel

      - name: Fetch fastchess and the opening book
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -sSLf -o fastchess.tar \
            "https://github.com/Disservin/fastchess/releases/download/$FASTCHESS_VERSION/fastchess-linux-x86-64.tar"
          tar -xf fastchess.tar
          # The archive's layout has changed between releases; locate the binary
          # rather than assuming a name, so a version bump fails loudly here
          # instead of silently later. v1.8.0-alpha extracts to a SUBDIRECTORY,
          # so compare the full path -- a basename test passes on
          # ./fastchess-linux-x86-64/fastchess and then leaves ./fastchess absent.
          bin=$(find . -type f -name 'fastchess*' ! -name '*.tar' | head -1)
          test -n "$bin"
          chmod +x "$bin"
          if [ "$bin" != ./fastchess ]; then mv "$bin" fastchess; fi
          ./fastchess --version
          curl -sSLf -o book.zip "$BOOK_URL"
          unzip -o -q book.zip
          test -s "$BOOK_FILE"

      - name: Stage the toolkit
        id: stage
        env:
          ROUNDS_PER_SHARD: ${{ needs.setup.outputs.rounds_per_shard }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp build/StratChessEvolved "$stage/candidate"
          cp "$RUNNER_TEMP/reference/build/StratChessEvolved" "$stage/reference"
          cp "$RUNNER_TEMP/tools/fastchess" "$stage/fastchess"
          cp "$RUNNER_TEMP/tools/$BOOK_FILE" "$stage/$BOOK_FILE"

          cand_sha=$(git rev-parse --short HEAD)
          ref_sha=$(git -C "$RUNNER_TEMP/reference" rev-parse --short HEAD)
          openings=$(grep -cve '^[[:space:]]*$' "$stage/$BOOK_FILE")

          # Every shard slices from the same book, so supply is checked against
          # the whole batch: shards x rounds openings are consumed, each yielding
          # one colour-swapped pair. Past the end fastchess wraps and replays,
          # which narrows an error bar without adding information to it.
          needed=$(( ROUNDS_PER_SHARD * SHARDS ))
          echo "Book: $BOOK_FILE ($openings openings); batch consumes $needed"
          if [ "$needed" -gt "$openings" ]; then
            echo "::error::Batch needs $needed openings but the book has $openings. Shards would overlap and replay games."
            exit 1
          fi

          {
            echo "cand_name=candidate-$cand_sha"
            echo "ref_name=reference-$ref_sha"
            echo "openings=$openings"
          } >> "$GITHUB_OUTPUT"

      # Both engines, fastchess and the book travel together as one artifact, so
      # a shard cannot end up with a mismatched pairing of them.
      - name: Upload the toolkit
        uses: actions/upload-artifact@v7
        with:
          name: strength-${{ github.run_id }}-toolkit
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # One job per shard. Each plays a disjoint, contiguous slice of the book, so
  # the shards together are exactly the batch a single job would have played.
  # ---------------------------------------------------------------------------
  match:
    needs: [setup, build]
    runs-on: ubuntu-24.04
    # A 1110-game shard at 10+0.1 with concurrency 3 runs ~172 min. This leaves
    # headroom without touching the 6 h job cap.
    timeout-minutes: 340
    strategy:
      # One shard failing must not cancel the rest: the aggregator refuses to
      # pool a partial batch anyway, and the surviving PGNs are still worth
      # having for diagnosis.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.setup.outputs.shard_list) }}
    steps:
      - name: Download the toolkit
        uses: actions/download-artifact@v7
        with:
          name: strength-${{ github.run_id }}-toolkit
          path: ${{ runner.temp }}/tools

      - name: Run shard ${{ matrix.shard }}
        id: match
        # Inputs reach the shell as environment variables rather than through
        # ${{ }} interpolation into the command line, which would splice their
        # text into the script.
        env:
          SHARD: ${{ matrix.shard }}
          ROUNDS: ${{ needs.setup.outputs.rounds_per_shard }}
          CANDIDATE_TC: ${{ inputs.candidate_tc }}
          REFERENCE_TC: ${{ inputs.reference_tc }}
          MATCH_CONCURRENCY: ${{ inputs.concurrency }}
          CAND_NAME: ${{ needs.build.outputs.cand_name }}
          REF_NAME: ${{ needs.build.outputs.ref_name }}
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          work="$RUNNER_TEMP/match"
          # Artifact download does not preserve the executable bit.
          chmod +x "$tools/fastchess" "$tools/candidate" "$tools/reference"
          # Separate working directories per engine: the engine writes logs
          # relative to its cwd, and spdlog fails silently when logs/ is absent.
          mkdir -p "$work/cand/logs" "$work/ref/logs"

          # Disjointness is arithmetic, not file surgery: with order=sequential,
          # shard i starting at i*ROUNDS+1 and playing ROUNDS pairs consumes
          # openings [i*R+1, (i+1)*R], which cannot overlap another shard's.
          # start= is 1-based.
          start=$(( SHARD * ROUNDS + 1 ))
          echo "Shard $SHARD: $ROUNDS pairs from opening $start"

          # compute_budget() bounds a move by the clock (issue #204), but an
          # increment under 100 ms still leaves the engine playing near-instant
          # moves at the bottom of its clock. A control run should halve the
          # BASE time and leave the increment alone; halving both measures the
          # time manager rather than the change under test.
          for tc in "$CANDIDATE_TC" "$REFERENCE_TC"; do
            inc=${tc#*+}
            if [ "$inc" = "$tc" ]; then inc=0; fi
            if awk -v i="$inc" 'BEGIN { exit !(i < 0.1) }'; then
              echo "::warning::Time control $tc has an increment below 0.1 s. Expect very fast play at low clock, and check the batch for time losses."
            fi
          done

          # Adjudication settings are copied from Run-EloMatch.ps1 verbatim: the
          # two instruments must differ only in toolchain and hardware.
          # Threads=1 on both sides -- Lazy SMP scales with core count, and a
          # shared runner has none to spare.
          cd "$work"
          start_s=$SECONDS
          set +e
          "$tools/fastchess" \
            -engine cmd="$tools/candidate" name="$CAND_NAME" dir=cand args=uci option.Threads=1 "tc=$CANDIDATE_TC" \
            -engine cmd="$tools/reference" name="$REF_NAME" dir=ref args=uci option.Threads=1 "tc=$REFERENCE_TC" \
            -each proto=uci \
            -rounds "$ROUNDS" -repeat -concurrency "$MATCH_CONCURRENCY" -recover \
            -openings file="$tools/$BOOK_FILE" format=epd order=sequential start="$start" \
            -draw movenumber=40 movecount=8 score=10 \
            -resign movecount=4 score=800 \
            -pgnout file=match.pgn notation=san \
            2>&1 | tee match.log
          fc_exit=${PIPESTATUS[0]}
          set -e
          echo "fastchess exit: $fc_exit"
          echo "elapsed_min=$(( (SECONDS - start_s) / 60 ))" >> "$GITHUB_OUTPUT"

          # A time loss, an illegal move or a disconnect is a harness or engine
          # BUG, not strength data. On a shared runner it most likely means the
          # box was oversubscribed, which invalidates every game in the shard,
          # not just the one that lost. Fail the shard; the aggregator then
          # refuses to pool the batch at all.
          if grep -Eiq 'illegal|disconnect|stall|loses on time' match.log; then
            echo "::error::Shard $SHARD: harness/engine failures detected -- batch is not measurable."
            grep -Ei 'illegal|disconnect|stall|loses on time' match.log | head -10
            exit 1
          fi
          test "$fc_exit" = "0"

      # Always runs, so a killed or crashed shard still yields its PGN -- the
      # games played up to that point are the only thing that cannot be redone.
      # The name must be unique per shard: upload-artifact@v4+ errors on a
      # duplicate name within a run.
      - name: Upload shard PGN and log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strength-${{ github.run_id }}-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/match/match.pgn
            ${{ runner.temp }}/match/match.log
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # Pool the shards into one figure. Runs even when a shard failed, so the
  # summary explains the discard rather than leaving a red X with no reason.
  # ---------------------------------------------------------------------------
  aggregate:
    needs: [setup, build, match]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # A biased subset wearing a full batch's error bar is worse than no
      # result: if three shards of twenty died, the surviving seventeen are not
      # a random sample of the batch -- they are the ones that happened not to
      # hit whatever went wrong. Refuse before pooling anything.
      - name: Refuse a partial batch
        if: needs.match.result != 'success'
        run: |
          {
            echo "## Strength lab — DISCARDED"
            echo
            echo "Shard jobs reported \`${{ needs.match.result }}\`. A batch with a failed shard is"
            echo "not a smaller batch, it is a biased one: the surviving shards are those that"
            echo "happened to avoid whatever went wrong. No pooled figure is reported."
            echo
            echo "Check the individual shard logs, then re-dispatch."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Download every shard
        uses: actions/download-artifact@v7
        with:
          pattern: strength-${{ github.run_id }}-shard-*
          path: shards

      - name: Verify the slices are disjoint
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          # Each shard should open on a different book position. A repeated
          # first FEN means two shards were handed the same slice, which would
          # double-count games and silently narrow the pooled interval.
          : > /tmp/first_fens.txt
          for pgn in shards/*/match.pgn; do
            fen=$(grep -m1 -oP '(?<=^\[FEN ")[^"]+' "$pgn" || true)
            if [ -z "$fen" ]; then
              # Not a cosmetic gap: without FEN tags this check silently passes
              # on every future run, so treat it as a broken check rather than a
              # missing nicety.
              echo "::error::$pgn has no [FEN] tag, so slice disjointness cannot be verified."
              exit 1
            fi
            echo "$fen" >> /tmp/first_fens.txt
          done
          sort -o /tmp/first_fens.txt /tmp/first_fens.txt

          total=$(wc -l < /tmp/first_fens.txt)
          unique=$(sort -u /tmp/first_fens.txt | wc -l)
          echo "Shard opening positions: $total total, $unique unique"
          if [ "$total" -ne "$unique" ]; then
            echo "::error::Shards share an opening position -- the book slices overlap."
            uniq -d /tmp/first_fens.txt
            exit 1
          fi
          if [ "$total" -ne "$SHARDS" ]; then
            echo "::error::Expected $SHARDS shard PGNs, found $total."
            exit 1
          fi

      - name: Pool the result
        id: pool
        env:
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          python3 .github/scripts/pool_pentanomial.py \
            --expect-shards "$SHARDS" \
            shards/*/match.log | tee /tmp/pooled.md

      - name: Report
        if: always()
        run: |
          {
            echo "## Strength lab"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Candidate | ${{ needs.build.outputs.cand_name }} @ \`${{ github.ref_name }}\`, tc=${{ inputs.candidate_tc }} |"
            echo "| Reference | ${{ needs.build.outputs.ref_name }} (\`${{ inputs.reference_ref }}\` = \`${{ needs.setup.outputs.reference_sha }}\`), tc=${{ inputs.reference_tc }} |"
            echo "| Games | ${{ needs.setup.outputs.actual_games }} = ${{ inputs.shards }} shards x ${{ needs.setup.outputs.games_per_shard }}, concurrency ${{ inputs.concurrency }} per shard |"
            echo "| Book | \`$BOOK_FILE\` (${{ needs.build.outputs.openings }} openings) |"
            echo "| Toolchain | GCC on ubuntu-24.04, Release, Threads=1 |"
            echo
            cat /tmp/pooled.md
            echo
            echo "Error bar is pentanomial: pooled over colour-swapped PAIRS, which are the"
            echo "independent unit. Pooling raw W/L/D would understate the variance."
          } >> "$GITHUB_STEP_SUMMARY"
