name: Strength lab

# Differential Elo measurement in CI: candidate (the dispatched ref) against a
# reference ref, both built here from source by the same toolchain. This is a
# SECOND instrument, not a replacement for Run-EloMatch.ps1 -- Linux/GCC numbers
# are not comparable with the clang-cl rows in Measurements/local.md, so they are
# recorded in a separate ledger. Ratios transfer, absolute values do not.
#
# The batch is sharded across parallel matrix jobs and pooled at the end. Each
# shard plays a disjoint slice of the opening book, so the shards are one batch
# split up rather than several batches averaged. The shard jobs, their repair and
# the job that closes them live in strength-wave.yml, called here as wave-1; a
# fixed-size run is that workflow's one-wave case.
#
# workflow_dispatch only, deliberately: a measurement harness that is wrong is
# worse than none, because its output looks exactly like a measurement. It gets
# calibrated against a null test and a known-sign control before anything
# triggers it automatically. Calibration runs are recorded in
# Measurements/ci-calibration.md.
on:
  workflow_dispatch:
    inputs:
      reference_ref:
        description: "Reference side. 'merge-base' measures this ref against where it forked from main, so the result is attributable to this change alone. A tag such as elo-reference-v2 measures cumulative strength instead; the candidate's own SHA is a null test only when build configuration, effective options and playing conditions also match"
        default: merge-base
      cmake_defines:
        description: "Whitespace-separated -DNAME=VALUE arguments applied identically to both engine builds; CMAKE_* variables are reserved"
        default: ""
      candidate_uci_options:
        description: "Whitespace-separated Name=Value UCI options set on the CANDIDATE only, e.g. 'Contempt=20'. This is how a default-off runtime option is measured without a probe branch. Checked against the engine's advertised option table before any shard starts; Threads is reserved -- use the threads input"
        default: ""
      reference_uci_options:
        description: "The same for the REFERENCE side. Usually empty: a difference between the two sides is what is being measured, so setting both rarely means what it looks like"
        default: ""
      candidate_arms:
        description: "Multi-arm screen: ';'-separated candidate option sets, each in candidate_uci_options syntax. Shard i plays arm i mod K, and each arm is pooled on its own shards against the shared reference. shards must be a multiple of K; cannot be combined with candidate_uci_options"
        default: ""
      calibration:
        description: "Declare an intentional harness calibration. Required for an identical comparison; labels a known-sign control without bypassing option or completion checks"
        type: boolean
        default: false
      opening_offset:
        description: "Book openings to skip before shard 0's slice. Give each run of a multi-run experiment its own range, so a confirmation never replays the openings a screen selected on"
        default: "0"
      games:
        description: "Total games across all shards (2 per opening pair; rounded down to fit the shards evenly)"
        default: "20088"
      shards:
        description: "Parallel match jobs. 18x1116 games is ~3 h wall-clock and leaves 2 of the 20 concurrent-job slots free, so other PRs still move; 20 consumes the whole allowance. Below ~16 a shard can exceed the job timeout"
        default: "18"
      candidate_tc:
        description: "Candidate time control, seconds+increment"
        default: "10+0.1"
      reference_tc:
        description: "Reference time control. For a known-sign control halve the BASE only (5+0.1) -- see the increment warning below"
        default: "10+0.1"
      concurrency:
        description: "Concurrent games PER SHARD. 4 vCPU per runner; validated at zero time losses at 3 -- raising it is what causes contention, not adding shards"
        default: "3"
      threads:
        description: "UCI Threads on BOTH engines. threads x concurrency must fit the runner's 4 vCPU, so Threads=4 needs concurrency 1 -- a third of the default game rate, so cut games to keep a shard inside the job timeout"
        default: "1"

# One strength run at a time, repository-wide. The group is deliberately a
# constant rather than keyed on the ref: a run takes 18 of the 20 concurrent
# jobs, so two runs on different refs would not queue -- they would both start,
# take nine shards each, and starve normal CI for far longer than either needs.
#
# Never cancel a running match: a superseded build is cheap to redo, an
# interrupted multi-hour batch is an afternoon thrown away.
#
# Note that only ONE run can wait: GitHub keeps a single pending run per group
# and cancels the previously pending one, so dispatching a third while a batch
# is running silently supersedes the second. Dispatch deliberately.
concurrency:
  group: strength-lab
  cancel-in-progress: false

env:
  # Pinned, like every other external asset this project measures with.
  FASTCHESS_VERSION: v1.8.2-alpha
  # UHO_4060_v3: 242,201 unbalanced human openings (the 4060 in the name is the
  # evaluation band the positions were selected from, not their count), i.e.
  # 484,402 distinct games -- no batch this plan contemplates can exhaust it.
  # Pinned to a commit rather than master so a re-run measures the same book.
  # Not committed to this repository: it is third-party data, and external test
  # assets live outside the checkout by convention (see M3 in
  # .claude/plans/retained/public-repo-and-strength-lab.md).
  BOOK_URL: https://raw.githubusercontent.com/official-stockfish/books/04738d057446e749cb071d58bac39df7f13efb47/UHO_4060_v3.epd.zip
  BOOK_FILE: UHO_4060_v3.epd
  # Shared dependency checkouts, as in build-and-test.yml. A reference without
  # cmake/DependencySources.cmake ignores it and clones: its build tree is never cached.
  STRAT_DEPS_SOURCE_CACHE: ${{ github.workspace }}/build/dep-sources

# Every Linux job below pins ubuntu-26.04, whose image ships Ninja and CMake on
# PATH -- `-G Ninja` needs no install step. Do not add one: it puts an Ubuntu apt
# mirror on the critical path of every job, and a stalled mirror hangs `apt-get
# update` indefinitely. A job on a different image must confirm this first.
#
# Every job sets timeout-minutes. The GitHub default is 6 hours, which a hung
# network step burns in full before anyone sees a verdict. The values are well
# above normal runtime -- they exist to catch a hang, not a slow runner.
jobs:
  # ---------------------------------------------------------------------------
  # Turn the requested game count into a shard plan. Doing the arithmetic once,
  # here, is what lets every later job agree on the slicing without recomputing
  # it -- and lets an impossible request fail in seconds instead of after a
  # build.
  # ---------------------------------------------------------------------------
  setup:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      rounds_per_shard: ${{ steps.plan.outputs.rounds_per_shard }}
      waves: ${{ steps.waves.outputs.waves }}
      wave_plan: ${{ steps.waves.outputs.wave_plan }}
      games_per_shard: ${{ steps.plan.outputs.games_per_shard }}
      actual_games: ${{ steps.plan.outputs.actual_games }}
      reference_sha: ${{ steps.reference.outputs.reference_sha }}
      shard_arms: ${{ steps.arms.outputs.shard_arms }}
      cmake_defines_validated: ${{ steps.defines.outputs.validated }}
    steps:
      # fetch-depth: 0 because the reference is resolved and verified here: a
      # merge base needs history, and a tag or SHA needs its objects present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate CMake defines
        id: defines
        env:
          CMAKE_DEFINES: ${{ inputs.cmake_defines }}
        run: |
          set -euo pipefail
          define_re='-D[A-Za-z_][A-Za-z0-9_]*=[A-Za-z0-9_./:+,@%=-]+'
          if [ -n "$CMAKE_DEFINES" ] && [[ ! "$CMAKE_DEFINES" =~ ^${define_re}([[:blank:]]+${define_re})*$ ]]; then
            echo "::error::cmake_defines must be whitespace-separated -DNAME=VALUE arguments; values may contain letters, digits, and . / : + , @ % = -"
            exit 1
          fi
          if [ -n "$CMAKE_DEFINES" ]; then
            read -r -a cmake_args <<< "$CMAKE_DEFINES"
            for define in "${cmake_args[@]}"; do
              name=${define#-D}
              name=${name%%=*}
              if [[ "$name" == CMAKE_* ]]; then
                echo "::error::cmake_defines may not set reserved CMAKE_* variables ('$name')."
                exit 1
              fi
            done
          fi
          echo "validated=true" >> "$GITHUB_OUTPUT"

      # Resolving here rather than in `build` follows the same rule as the
      # pooling self-test below: a reference that does not exist costs seconds
      # now instead of failing after Ninja and a full candidate build.
      #
      # Measuring against a fixed tag cannot separate this change's delta from
      # the margin main had already accumulated, which is why the merge base is
      # the default -- see Measurements/ci-per-change.md.
      - name: Resolve the reference
        id: reference
        env:
          REFERENCE_REF: ${{ inputs.reference_ref }}
        run: |
          set -euo pipefail
          if [ "$REFERENCE_REF" = "merge-base" ]; then
            git fetch --no-tags --quiet origin main
            if ! resolved=$(git merge-base HEAD FETCH_HEAD); then
              echo "::error::No merge base between this ref and origin/main."
              exit 1
            fi
          else
            resolved="$REFERENCE_REF"
          fi

          if ! sha=$(git rev-parse --verify --quiet "$resolved^{commit}"); then
            echo "::error::Reference '$REFERENCE_REF' does not resolve to a commit."
            exit 1
          fi
          echo "Reference: $REFERENCE_REF -> $sha"
          echo "reference_sha=$sha" >> "$GITHUB_OUTPUT"

      # Per-shard concurrency has to be sized off PHYSICAL cores: a search
      # thread gains nothing from SMT sharing, and oversubscribing adds timing
      # noise. The match shards run on the same
      # runner label as this job, so recording the topology once here says what
      # the 4 vCPU actually are.
      - name: Record the runner's CPU topology
        run: lscpu

      # Before anything expensive. A wrong error bar is the failure mode this
      # whole milestone exists to avoid, and finding out after a three-hour
      # batch that the aggregator does not work -- or is not even present --
      # costs the batch. Checked against real fastchess output; see the script.
      - name: Verify the pooling formula
        run: python3 .github/scripts/pool_pentanomial.py --self-test

      # Same argument for the waved SPRT's statistic and plan: a wrong LLR or cut
      # would stop a run on the wrong evidence.
      - name: Verify the SPRT statistic
        run: python3 .github/scripts/sprt.py --self-test

      # Same argument as the pooling self-test: the option checker is what stops
      # a mistyped option name from producing a three-hour null result, so it is
      # verified before the option string it will be given reaches an engine.
      - name: Verify the UCI option checker
        run: python3 .github/scripts/validate_uci_options.py --self-test

      - name: Verify comparison integrity
        run: python3 .github/scripts/compare_lab_configs.py --self-test

      # Routing a log to the wrong arm would credit one setting with another's
      # games and still print a plausible table, so the router is checked first.
      - name: Verify the arm router
        run: python3 .github/scripts/plan_arms.py --self-test

      # A wrong repair verdict would pool a batch that should have been discarded.
      - name: Verify the repair planner
        run: python3 .github/scripts/plan_repair.py --self-test

      - name: Verify the CPU summary
        run: python3 .github/scripts/summarize_cpu.py --self-test

      - name: Verify workflow integrity boundaries
        run: python3 .github/scripts/test_strength_workflow.py --self-test

      - name: Plan the shards
        id: plan
        env:
          GAMES: ${{ inputs.games }}
          SHARDS: ${{ inputs.shards }}
        run: |
          set -euo pipefail
          case "$GAMES" in ''|*[!0-9]*) echo "::error::games must be a positive integer"; exit 1;; esac
          case "$SHARDS" in ''|*[!0-9]*) echo "::error::shards must be a positive integer"; exit 1;; esac
          test "$SHARDS" -ge 1 || { echo "::error::shards must be >= 1"; exit 1; }

          # A pair (one opening, both colours) is the indivisible unit: it is the
          # independent sample the pooled error bar is computed over, so a shard
          # boundary must never fall inside one.
          rounds_total=$(( GAMES / 2 ))
          rounds_per_shard=$(( rounds_total / SHARDS ))
          if [ "$rounds_per_shard" -lt 1 ]; then
            echo "::error::$GAMES games across $SHARDS shards leaves under one pair per shard."
            exit 1
          fi
          games_per_shard=$(( rounds_per_shard * 2 ))
          actual_games=$(( games_per_shard * SHARDS ))
          if [ "$actual_games" -ne "$GAMES" ]; then
            echo "::warning::Requested $GAMES games; playing $actual_games so every shard gets $rounds_per_shard whole pairs."
          fi

          {
            echo "rounds_per_shard=$rounds_per_shard"
            echo "games_per_shard=$games_per_shard"
            echo "actual_games=$actual_games"
          } >> "$GITHUB_OUTPUT"

          echo "Plan: $SHARDS shards x $games_per_shard games = $actual_games games"

      # Without pondering only the side to move searches, so a game keeps at
      # most `threads` vCPU busy. Oversubscribing the runner shows up as time losses, which fail the
      # shard -- so refuse the combination here, before a build.
      - name: Check the per-shard CPU budget
        env:
          THREADS: ${{ inputs.threads }}
          MATCH_CONCURRENCY: ${{ inputs.concurrency }}
          RUNNER_VCPUS: "4"
        run: |
          set -euo pipefail
          for value in "$THREADS" "$MATCH_CONCURRENCY"; do
            if [[ ! "$value" =~ ^[1-9][0-9]{0,2}$ ]]; then
              echo "::error::threads and concurrency must be positive integers without leading zeros ('$value')"
              exit 1
            fi
          done
          if [ $(( THREADS * MATCH_CONCURRENCY )) -gt "$RUNNER_VCPUS" ]; then
            echo "::error::threads $THREADS x concurrency $MATCH_CONCURRENCY exceeds the runner's $RUNNER_VCPUS vCPU."
            exit 1
          fi
          echo "CPU budget: Threads=$THREADS x concurrency $MATCH_CONCURRENCY of $RUNNER_VCPUS vCPU"

      # Shape only: whether the engine advertises each arm's options is checked
      # in `build`, against the binary that will play.
      - name: Plan the arms
        id: arms
        env:
          SHARDS: ${{ inputs.shards }}
          CANDIDATE_ARMS: ${{ inputs.candidate_arms }}
          CANDIDATE_UCI_OPTIONS: ${{ inputs.candidate_uci_options }}
          OPENING_OFFSET: ${{ inputs.opening_offset }}
        run: |
          set -euo pipefail
          # No leading zero, which bash arithmetic reads as octal, and short
          # enough that no later sum can overflow.
          if [[ ! "$OPENING_OFFSET" =~ ^(0|[1-9][0-9]{0,8})$ ]]; then
            echo "::error::opening_offset must be a non-negative integer without leading zeros"
            exit 1
          fi
          if [ -n "$CANDIDATE_ARMS" ] && [ -n "$CANDIDATE_UCI_OPTIONS" ]; then
            echo "::error::Set candidate_arms or candidate_uci_options, not both."
            exit 1
          fi
          shard_arms=$(python3 .github/scripts/plan_arms.py matrix --arms "$CANDIDATE_ARMS" --shards "$SHARDS")
          echo "shard_arms=$shard_arms" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/plan_arms.py list --arms "$CANDIDATE_ARMS"

      # Fixed before any game, so no result can choose which pairs a wave plays.
      # Every run is fixed-size here: one wave, whose slices are the whole shards.
      - name: Plan the waves
        id: waves
        env:
          SHARDS: ${{ inputs.shards }}
          ROUNDS: ${{ steps.plan.outputs.rounds_per_shard }}
          OPENING_OFFSET: ${{ inputs.opening_offset }}
        run: |
          set -euo pipefail
          # opening_offset was checked by Plan the arms.
          waves=1
          echo "waves=$waves" >> "$GITHUB_OUTPUT"
          python3 .github/scripts/sprt.py plan --shards "$SHARDS" --rounds "$ROUNDS" \
            --opening-offset "$OPENING_OFFSET" --waves "$waves" --output "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build both engines and stage the harness ONCE. Across 18 shards this saves
  # ~1 hour of duplicated runner time, but the real argument is correctness:
  # every shard must play the same two binaries against the same book. Building
  # once and shipping artifacts guarantees that; 18 independent builds only
  # assume it.
  # ---------------------------------------------------------------------------
  build:
    needs: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      cand_name: ${{ steps.stage.outputs.cand_name }}
      ref_name: ${{ steps.stage.outputs.ref_name }}
      openings: ${{ steps.stage.outputs.openings }}
      book_file: ${{ steps.stage.outputs.book_file }}
    steps:
      # fetch-depth: 0 for the tags and history the reference checkout needs.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same key as build-and-test.yml and nightly.yml, so this shares their
      # cache entry rather than paying for its own clone of the dependencies.
      - name: Cache dependency sources
        uses: actions/cache@v6
        with:
          path: build/dep-sources
          key: dep-sources-spdlog-v1.17.0-json-v3.12.0-catch2-v3.16.1

      # Release only. Both sides are built from the same compiler with the same
      # flags, which is the invariant every Elo number in this project depends
      # on -- a candidate and reference built by different toolchains show the
      # compiler gap as a phantom strength change (issue #84).
      - name: Build candidate
        env:
          CMAKE_DEFINES: ${{ inputs.cmake_defines }}
        run: |
          set -euo pipefail
          cmake_args=()
          if [ -n "$CMAKE_DEFINES" ]; then read -r -a cmake_args <<< "$CMAKE_DEFINES"; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${cmake_args[@]}"
          cmake --build build --target StratChessEvolved --parallel

      # The reference is built from its own source tree, not from a cached
      # binary: there is no Linux equivalent of EngineTesting\ here, and a
      # from-source build is what makes an arbitrary ref measurable.
      - name: Build reference (${{ inputs.reference_ref }} = ${{ needs.setup.outputs.reference_sha }})
        env:
          REFERENCE_REF: ${{ needs.setup.outputs.reference_sha }}
          CMAKE_DEFINES: ${{ inputs.cmake_defines }}
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/reference" "$REFERENCE_REF"
          cmake_args=()
          if [ -n "$CMAKE_DEFINES" ]; then read -r -a cmake_args <<< "$CMAKE_DEFINES"; fi
          cmake -S "$RUNNER_TEMP/reference" -B "$RUNNER_TEMP/reference/build" -G Ninja -DCMAKE_BUILD_TYPE=Release "${cmake_args[@]}"
          cmake --build "$RUNNER_TEMP/reference/build" --target StratChessEvolved --parallel

      - name: Fetch fastchess and the opening book
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools"
          cd "$RUNNER_TEMP/tools"
          curl -sSLf -o fastchess.tar \
            "https://github.com/Disservin/fastchess/releases/download/$FASTCHESS_VERSION/fastchess-linux-x86-64.tar"
          tar -xf fastchess.tar
          # The archive's layout has changed between releases; locate the binary
          # rather than assuming a name, so a version bump fails loudly here
          # instead of silently later. The pinned release extracts to a SUBDIRECTORY,
          # so compare the full path -- a basename test passes on
          # ./fastchess-linux-x86-64/fastchess and then leaves ./fastchess absent.
          bin=$(find . -type f -name 'fastchess*' ! -name '*.tar' | head -1)
          test -n "$bin"
          chmod +x "$bin"
          if [ "$bin" != ./fastchess ]; then mv "$bin" fastchess; fi
          ./fastchess --version
          curl -sSLf -o book.zip "$BOOK_URL"
          unzip -o -q book.zip
          test -s "$BOOK_FILE"

      - name: Stage the toolkit
        id: stage
        env:
          ROUNDS_PER_SHARD: ${{ needs.setup.outputs.rounds_per_shard }}
          SHARDS: ${{ inputs.shards }}
          OPENING_OFFSET: ${{ inputs.opening_offset }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage"
          cp build/StratChessEvolved "$stage/candidate"
          cp "$RUNNER_TEMP/reference/build/StratChessEvolved" "$stage/reference"
          cp "$RUNNER_TEMP/tools/fastchess" "$stage/fastchess"
          cp "$RUNNER_TEMP/tools/$BOOK_FILE" "$stage/$BOOK_FILE"
          cp .github/scripts/cpu_sampler.sh "$stage/cpu_sampler.sh"
          cp .github/scripts/play_shard.sh "$stage/play_shard.sh"

          cand_sha=$(git rev-parse --short HEAD)
          ref_sha=$(git -C "$RUNNER_TEMP/reference" rev-parse --short HEAD)
          openings=$(grep -cve '^[[:space:]]*$' "$stage/$BOOK_FILE")

          # Every shard slices from the same book, so supply is checked against
          # the whole batch: shards x rounds openings are consumed, each yielding
          # one colour-swapped pair. Past the end fastchess wraps and replays,
          # which narrows an error bar without adding information to it.
          # The offset skips openings, so the batch ends at opening offset + R*S.
          needed=$(( OPENING_OFFSET + ROUNDS_PER_SHARD * SHARDS ))
          echo "Book: $BOOK_FILE ($openings openings); batch consumes up to opening $needed"
          if [ "$needed" -gt "$openings" ]; then
            echo "::error::Batch needs openings up to $needed but the book has $openings. Shards would overlap and replay games."
            exit 1
          fi

          {
            echo "cand_name=candidate-$cand_sha"
            echo "ref_name=reference-$ref_sha"
            echo "openings=$openings"
            echo "book_file=$BOOK_FILE"
          } >> "$GITHUB_OUTPUT"

      # Resolve defaults even with empty overrides, against the staged binaries
      # that will play. Refuse unintended identical conditions before any shard.
      - name: Verify the resolved comparison
        env:
          CANDIDATE_UCI_OPTIONS: ${{ inputs.candidate_uci_options }}
          REFERENCE_UCI_OPTIONS: ${{ inputs.reference_uci_options }}
          CANDIDATE_ARMS: ${{ inputs.candidate_arms }}
          REFERENCE_SHA: ${{ needs.setup.outputs.reference_sha }}
          CANDIDATE_TC: ${{ inputs.candidate_tc }}
          REFERENCE_TC: ${{ inputs.reference_tc }}
          CMAKE_DEFINES: ${{ inputs.cmake_defines }}
          CALIBRATION: ${{ inputs.calibration }}
          THREADS: ${{ inputs.threads }}
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage"
          evidence="$RUNNER_TEMP/evidence"
          mkdir -p "$evidence"
          cp "$stage/$BOOK_FILE" "$evidence/$BOOK_FILE"
          calibration_args=()
          if [ "$CALIBRATION" = "true" ]; then calibration_args+=(--calibration); fi
          python3 .github/scripts/compare_lab_configs.py \
            --candidate "$stage/candidate" --reference "$stage/reference" \
            --candidate-revision "$GITHUB_SHA" --reference-revision "$REFERENCE_SHA" \
            --candidate-options "$CANDIDATE_UCI_OPTIONS" --reference-options "$REFERENCE_UCI_OPTIONS" \
            --arms "$CANDIDATE_ARMS" --candidate-tc "$CANDIDATE_TC" --reference-tc "$REFERENCE_TC" \
            --cmake-defines="$CMAKE_DEFINES" --toolchain "GCC 15 on ubuntu-26.04, Release" --threads "$THREADS" \
            "${calibration_args[@]}" --output "$evidence/comparison.md"

      - name: Retain the intended comparison in the build summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/evidence/comparison.md" ]; then
            cat "$RUNNER_TEMP/evidence/comparison.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The aggregate may be rerun after the one-day executable toolkit expires.
      - name: Upload comparison and opening evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: strength-${{ github.run_id }}-comparison
          path: ${{ runner.temp }}/evidence
          if-no-files-found: warn
          retention-days: 90

      # Both engines, fastchess and the book travel together as one artifact, so
      # a shard cannot end up with a mismatched pairing of them.
      - name: Upload the toolkit
        uses: actions/upload-artifact@v7
        with:
          name: strength-${{ github.run_id }}-toolkit
          path: ${{ runner.temp }}/stage
          if-no-files-found: error
          retention-days: 1

  # ---------------------------------------------------------------------------
  # The run's shard jobs, their repair and the job that closes them, as one wave
  # (strength-wave.yml). The scope granted here is the most its repair planner can
  # hold: it reads the run's jobs, their annotations and its artifacts.
  # ---------------------------------------------------------------------------
  wave-1:
    needs: [setup, build]
    permissions:
      actions: read
      checks: read
      contents: read
    uses: ./.github/workflows/strength-wave.yml
    with:
      wave: 1
      waves: ${{ fromJSON(needs.setup.outputs.waves) }}
      wave_plan: ${{ needs.setup.outputs.wave_plan }}
      slices: ${{ toJSON(fromJSON(needs.setup.outputs.wave_plan)[0]) }}
      prior_lost: 0
      book_file: ${{ needs.build.outputs.book_file }}
      candidate_tc: ${{ inputs.candidate_tc }}
      reference_tc: ${{ inputs.reference_tc }}
      concurrency: ${{ inputs.concurrency }}
      threads: ${{ inputs.threads }}
      candidate_uci_options: ${{ inputs.candidate_uci_options }}
      reference_uci_options: ${{ inputs.reference_uci_options }}
      candidate_arms: ${{ inputs.candidate_arms }}
      shard_arms: ${{ needs.setup.outputs.shard_arms }}
      cand_name: ${{ needs.build.outputs.cand_name }}
      ref_name: ${{ needs.build.outputs.ref_name }}

  # ---------------------------------------------------------------------------
  # Pool the shards into one figure per arm. Runs even when a shard failed, so the
  # summary explains the discard rather than leaving a red X with no reason.
  # ---------------------------------------------------------------------------
  aggregate:
    needs: [setup, build, wave-1]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Scoped to this job, which is the only one that writes anything back. The
    # other jobs keep the default read-only token.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      # The wave's decide job refused a partial wave or failed a check; either way
      # nothing pools. Its outputs, not which artifacts exist, say which.
      - name: Refuse a partial batch
        if: ${{ needs.wave-1.outputs.status != 'complete' }}
        env:
          WAVE_STATUS: ${{ needs.wave-1.outputs.status }}
          WAVE_REASON: ${{ needs.wave-1.outputs.reason }}
          WAVE_RESULT: ${{ needs.wave-1.result }}
        run: |
          {
            echo "## Strength lab — DISCARDED"
            echo
            if [ "$WAVE_STATUS" = "discarded" ]; then
              echo "$WAVE_REASON"
            elif [ "$WAVE_RESULT" = "skipped" ]; then
              echo "No shard ran: setup or build did not complete."
            else
              echo "The wave ended \`$WAVE_RESULT\` without a decision: a check after the shards failed, or the run was cancelled."
            fi
            echo
            echo "A batch with a failed shard is not a smaller batch, it is a biased one: the surviving"
            echo "shards are those that happened to avoid whatever went wrong. No pooled figure is reported."
            echo "Check the individual shard logs. A manual repair may still apply: measure-strength, strength-lab.md."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Even for a refused batch: its shards' CPU samples are what explain a
      # time loss. Nothing after the refusal pools them.
      - name: Download every shard
        if: always()
        uses: actions/download-artifact@v8
        with:
          pattern: strength-${{ github.run_id }}-shard-*
          path: shards

      - name: Download comparison and opening evidence
        uses: actions/download-artifact@v8
        with:
          name: strength-${{ github.run_id }}-comparison
          path: evidence

      # Replayed shards were assembled, verified and uploaded under their shard
      # names by the wave's decide job; this is the plan the marker carries.
      - name: Record the repair plan
        if: needs.wave-1.outputs.lost_a != ''
        env:
          SLICES: ${{ needs.wave-1.outputs.slices }}
        run: |
          set -euo pipefail
          printf '%s\n' "$SLICES" > repair-plan.json

      - name: Verify the complete batch
        env:
          SHARDS: ${{ inputs.shards }}
          ROUNDS: ${{ needs.setup.outputs.rounds_per_shard }}
          CANDIDATE_ARMS: ${{ inputs.candidate_arms }}
          OPENING_OFFSET: ${{ inputs.opening_offset }}
          CAND_NAME: ${{ needs.build.outputs.cand_name }}
          REF_NAME: ${{ needs.build.outputs.ref_name }}
        run: |
          set -euo pipefail
          test -s evidence/comparison.md
          python3 .github/scripts/plan_arms.py verify \
            --arms "$CANDIDATE_ARMS" --shards "$SHARDS" --rounds-per-shard "$ROUNDS" \
            --opening-offset "$OPENING_OFFSET" --candidate-name "$CAND_NAME" --reference-name "$REF_NAME" \
            --book "evidence/$BOOK_FILE" --shard-root shards

      - name: Pool the result
        id: pool
        env:
          SHARDS: ${{ inputs.shards }}
          ROUNDS: ${{ needs.setup.outputs.rounds_per_shard }}
          CANDIDATE_ARMS: ${{ inputs.candidate_arms }}
        run: |
          set -euo pipefail
          # Publish only after every pool succeeds; a partial arm table is invalid.
          if [ -z "$CANDIDATE_ARMS" ]; then
            python3 .github/scripts/pool_pentanomial.py \
              --expect-shards "$SHARDS" --expect-pairs-per-shard "$ROUNDS" \
              shards/*/match.log > /tmp/pooled.pending.md
          else
            arm_list=$(python3 .github/scripts/plan_arms.py list --arms "$CANDIDATE_ARMS")
            arm_count=$(printf '%s\n' "$arm_list" | wc -l)
            : > /tmp/arms.pending.md
            : > /tmp/arms.tsv
            while IFS=$'\t' read -r arm options; do
              arm_logs=$(python3 .github/scripts/plan_arms.py logs \
                --arms "$CANDIDATE_ARMS" --shards "$SHARDS" --arm "$arm" shards/*/match.log)
              mapfile -t logs <<< "$arm_logs"
              echo "### Arm $arm: \`$options\`" >> /tmp/arms.pending.md
              echo >> /tmp/arms.pending.md
              python3 .github/scripts/pool_pentanomial.py \
                --expect-shards $(( SHARDS / arm_count )) --expect-pairs-per-shard "$ROUNDS" \
                --label "$arm: \`$options\`" --summary-tsv /tmp/arms.tsv \
                "${logs[@]}" >> /tmp/arms.pending.md
              echo >> /tmp/arms.pending.md
            done <<< "$arm_list"
            {
              echo "### Arms"
              echo
              python3 .github/scripts/pool_pentanomial.py --render-summary /tmp/arms.tsv
              echo
              cat /tmp/arms.pending.md
            } > /tmp/pooled.pending.md
          fi
          mv /tmp/pooled.pending.md /tmp/pooled.md
          cat /tmp/pooled.md

      # Last: a repaired run stays red, and this marker is what tells PGN sync it pooled.
      - name: Mark the run as repaired
        if: steps.pool.outcome == 'success' && needs.wave-1.outputs.lost_a != ''
        uses: actions/upload-artifact@v7
        with:
          name: strength-${{ github.run_id }}-repair
          path: repair-plan.json
          if-no-files-found: error
          retention-days: 90

      # Built once into a file and used twice, so the pull-request comment and
      # the job summary cannot drift apart.
      - name: Report
        if: always()
        env:
          CMAKE_DEFINES: ${{ inputs.cmake_defines }}
          CMAKE_DEFINES_VALIDATED: ${{ needs.setup.outputs.cmake_defines_validated }}
          CANDIDATE_UCI_OPTIONS: ${{ inputs.candidate_uci_options }}
          REFERENCE_UCI_OPTIONS: ${{ inputs.reference_uci_options }}
          CANDIDATE_ARMS: ${{ inputs.candidate_arms }}
          OPENING_OFFSET: ${{ inputs.opening_offset }}
          ACTUAL_GAMES: ${{ needs.setup.outputs.actual_games }}
          THREADS: ${{ inputs.threads }}
          BUILD_RESULT: ${{ needs.build.result }}
          POOL_RESULT: ${{ steps.pool.outcome }}
          REPLAYED: ${{ needs.wave-1.outputs.replayed }}
        run: |
          {
            if [ "$POOL_RESULT" = "success" ]; then
              echo "## Strength lab"
            else
              echo "## Strength lab — DISCARDED"
            fi
            echo
            echo "| | |"
            echo "|---|---|"
            if [ -n "$CANDIDATE_ARMS" ]; then
              echo "| Candidate | ${{ needs.build.outputs.cand_name }} @ \`${{ github.ref_name }}\`, tc=${{ inputs.candidate_tc }}, options per arm (below) |"
            else
              echo "| Candidate | ${{ needs.build.outputs.cand_name }} @ \`${{ github.ref_name }}\`, tc=${{ inputs.candidate_tc }}, options \`${CANDIDATE_UCI_OPTIONS:-none}\` |"
            fi
            echo "| Reference | ${{ needs.build.outputs.ref_name }} (\`${{ inputs.reference_ref }}\` = \`${{ needs.setup.outputs.reference_sha }}\`), tc=${{ inputs.reference_tc }}, options \`${REFERENCE_UCI_OPTIONS:-none}\` |"
            echo "| Games | ${{ needs.setup.outputs.actual_games }} = ${{ inputs.shards }} shards x ${{ needs.setup.outputs.games_per_shard }}, concurrency ${{ inputs.concurrency }} per shard |"
            if [ "$POOL_RESULT" = "success" ] && [ -n "$REPLAYED" ]; then
              echo "| Replayed | $REPLAYED |"
            fi
            echo "| Book | \`$BOOK_FILE\` (${{ needs.build.outputs.openings }} openings) |"
            if [ "$OPENING_OFFSET" != "0" ] && [ -n "$ACTUAL_GAMES" ]; then
              echo "| Openings | $(( OPENING_OFFSET + 1 ))–$(( OPENING_OFFSET + ACTUAL_GAMES / 2 )) (offset $OPENING_OFFSET) |"
            fi
            echo "| Toolchain | GCC 15 on ubuntu-26.04, Release, Threads=$THREADS |"
            if [ "$CMAKE_DEFINES_VALIDATED" != "true" ]; then
              echo "| CMake defines | Not accepted by setup; no engine was built |"
            elif [ "$BUILD_RESULT" = "success" ]; then
              echo "| CMake defines | \`${CMAKE_DEFINES:-none}\` (applied to both engines) |"
            else
              echo "| CMake defines | \`${CMAKE_DEFINES:-none}\` (accepted; both builds did not complete) |"
            fi
            echo
            if [ -s evidence/comparison.md ]; then
              cat evidence/comparison.md
              echo
            else
              echo "Comparison evidence is unavailable; see the build summary."
            fi
            if [ "$POOL_RESULT" = "success" ]; then
              cat /tmp/pooled.md
            else
              echo "The batch did not pass all integrity checks. No pooled figure is reported."
            fi
            echo
            echo "Error bar is pentanomial: pooled over colour-swapped PAIRS, which are the"
            echo "independent unit. Pooling raw W/L/D would understate the variance."
            echo
            python3 .github/scripts/summarize_cpu.py shards/*/ || echo "Runner CPU summary unavailable."
            echo
            echo "[Run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > /tmp/report.md
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      # A three-hour measurement is worth little if it is only discoverable by
      # remembering which run produced it, so the result is posted to the pull
      # request for the dispatched branch.
      #
      # Only when pooling succeeded: a discarded batch has no figure to report,
      # and the job summary already explains the discard.
      #
      # A dispatch always runs on a branch of this repository, so any pull
      # request found here is same-repo and the token can comment on it. The
      # fork restriction that would otherwise need `pull_request_target`, which
      # no workflow here uses, cannot arise on this trigger.
      #
      # Exactly one open pull request, or nothing: none and the run was not for
      # a review, several and the right thread is a guess. Either way the job
      # summary has already been written, so nothing is lost by staying quiet.
      - name: Comment on the branch's pull request
        if: steps.pool.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')
          count=$(printf '%s' "$prs" | grep -c '[0-9]' || true)
          if [ "$count" -ne 1 ]; then
            echo "Found $count open pull requests for '$GITHUB_REF_NAME'; the job summary is the only report."
            exit 0
          fi
          gh pr comment "$prs" --body-file /tmp/report.md
          echo "Posted the result to pull request #$prs."
